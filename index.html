  // ---------- GI ↔ ตีคืน (เทียบเป็นรอบ: รอบเก่าใช้ GI ก่อน) ----------
  function giRecon(rets, todayOverride) {
    const today = todayOverride || todayKey()
    const minSap = SAPM.rows.map((x) => x.date).sort()[0] || ''
    const gis = new Map() // code -> [{date, doc, rem, p}]
    SAPM.rows.filter((x) => x.type === 'GI').sort((a, b) => a.date.localeCompare(b.date)).forEach((x) => {
      const pk = packsOf(x)
      const l = gis.get(x.code) || []
      l.push({ date: x.date, doc: x.doc, p: pk.p, rem: pk.p == null ? qtyOf(x) : pk.p, raw: qtyOf(x) + ' ' + x.uom, why: pk.why || '', name: x.name })
      gis.set(x.code, l)
    })
    const rmap = new Map() // sent -> code -> qty
    rets.filter((e) => e.sent).forEach((e) => {
      const m = rmap.get(e.sent) || new Map()
      m.set(e.code, Math.round(((m.get(e.code) || 0) + e.qty) * 1000) / 1000)
      rmap.set(e.sent, m)
    })
    const rounds = Array.from(rmap.keys()).sort().map((S) => {
      const items = Array.from(rmap.get(S).entries()).sort((a, b) => (a[0] < b[0] ? -1 : 1)).map(([code, need]) => {
        if (!minSap || S < addDays(minSap, -3)) return { code: code, need: need, got: 0, docs: [], st: 'nodata', txt: '— ไม่มีข้อมูล SAP ช่วงนั้น' }
        let got = 0
        const docs = []
        ;(gis.get(code) || []).forEach((g) => {
          if (need - got <= TOL_GI || g.rem <= 0.001 || g.date < addDays(S, -3)) return
          const t = Math.min(g.rem, need - got)
          g.rem = Math.round((g.rem - t) * 1000) / 1000; got = Math.round((got + t) * 1000) / 1000
          if (docs.indexOf(g.doc) < 0) docs.push(g.doc)
        })
        return { code: code, need: need, got: r2(got), docs: docs }
      })
      // คลังอาจทำ GI ช้า: ขาดอยู่แต่ส่งคืนมาไม่เกิน GI_WAIT วัน = รอ (เหลือง) · เกินนั้น = ไม่ตรง (แดง)
      const age = dayDiff(S, today)
      items.forEach((i) => {
        if (i.st) return
        const diff = r2(i.got - i.need)
        i.st = Math.abs(diff) <= TOL_GI ? 'ok' : diff < 0 && age <= GI_WAIT ? 'wait' : 'bad'
        i.txt = i.st === 'ok' ? '✔ ตรง'
          : i.st === 'wait' ? (i.got ? '⏳ GI ยังไม่ครบ ขาด ' + fmtNum(-diff) : '⏳ รอคลังทำ GI') + ' (รอมา ' + age + ' วัน)'
          : diff > 0 ? '▲ GI มากกว่าที่ตีคืน ' + fmtNum(diff)
          : (i.got ? '▼ GI น้อยกว่าที่ตีคืน ' + fmtNum(-diff) : '✖ ไม่มี GI') + ' (เกิน ' + GI_WAIT + ' วัน)'
      })
      const nb = items.filter((i) => i.st === 'bad').length, nw = items.filter((i) => i.st === 'wait').length
      return { sent: S, age: dayDiff(S, today), items: items, bad: nb, wait: nw, nodata: items.every((i) => i.st === 'nodata') }
    })
    const extra = []
    gis.forEach((l, code) => l.forEach((g) => { if (g.rem > TOL_GI) extra.push({ code: code, name: g.name, date: g.date, doc: g.doc, left: r2(g.rem), raw: g.raw, why: g.why }) }))
    extra.sort((a, b) => b.date.localeCompare(a.date) || (a.code < b.code ? -1 : 1))
    return { rounds: rounds.reverse(), extra: extra, bad: rounds.reduce((a, r) => a + r.bad, 0), wait: rounds.reduce((a, r) => a + r.wait, 0) }
  }
  function dayDiff(a, b) { return Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 86400000) }
  async function loadRets() {
    if (CFG.MODE === 'return') return entries.filter((e) => SESSION && e.branchId === SESSION.branchId)
    const d = await sapApi('getReturns', { from: todayKey(new Date(Date.now() - 90 * 86400000)) })
    return d.items || []
  }

          cols: [{ h: 'ลำดับ', cls: 'c', w: '5%' }, { h: 'รหัสสินค้า', cls: 'code', w: '10%' }, { h: 'ชื่อสินค้า' }, { h: 'แพ็คไซต์', w: '10%' }, { h: 'ตีคืน (แอป)', cls: 'n', w: '8%' }, { h: 'GI (แพ็ค)', cls: 'n', w: '8%' }, { h: 'เลขที่ GI', w: '13%' }, { h: 'ผล', w: '17%' }],
          rows: rows,
          summary: '✔ ตรง = ต่างไม่เกิน ' + TOL_GI + ' แพ็ค (GI ตัดเป็นเศษแพ็คได้) · ⏳ รอคลังทำ GI = ส่งคืนมาไม่เกิน ' + GI_WAIT + ' วัน ยังไม่ถือว่าผิด (คลังอาจทำ GI ช้า) · เกิน ' + GI_WAIT + ' วันแล้วยังไม่มี GI = ⚠️ ไม่ตรง · GI ที่ลงวันที่ก่อนวันส่งคืนเกิน 3 วันจะไม่ถูกจับคู่',
          noteBox: 'หมายเหตุ:', sign: ['ผู้ทำรายการตีคืน', 'ผู้ตรวจสอบ (คลัง)', 'ผู้จัดการสาขา'], empty: 'ทุกรอบตรงกับ GI แล้ว ✔', footRight: 'แอป' + CFG.TITLE + ' · ข้อมูล SAP'

  function printSapTypes() {
    if (!SAPM.rows.length) { toast('ยังไม่มีข้อมูล SAP', 'err'); return }
    const last = SAPM.rows.map((x) => x.date).sort().pop()
    const opts = [['all|2', 'ทุกประเภท · 2 วันล่าสุด'], ['all|7', 'ทุกประเภท · 7 วันล่าสุด']].concat(SAPM_TYPES.map((t) => [t[0] + '|7', t[1].split(' — ')[0] + ' ' + t[0] + ' · 7 วันล่าสุด']))
    window.PrintKit.open({
      name: 'สรุปความเคลื่อนไหวสินค้า SAP', options: opts,
      build: (opt) => {
        const [sel, nd] = opt.split('|')
        const from = addDays(last, -(Number(nd) - 1))
        const rows = []
        let n = 0, cnt = 0
        SAPM_TYPES.filter((t) => sel === 'all' || sel === t[0]).forEach((t) => {
          const m = new Map()
          SAPM.rows.filter((x) => sapmType(x.type) === t[0] && x.date >= from && x.date <= last).forEach((x) => {
            const c = m.get(x.code) || { code: x.code, name: x.name, uom: x.uom, qty: 0, packs: 0, docs: new Set(), days: new Set(), types: new Set() }
            const pk = packsOf(x)
            c.qty = Math.round((c.qty + qtyOf(x)) * 1000) / 1000
            if (pk.p == null) c.packs = null; else if (c.packs != null) c.packs += pk.p
            c.docs.add(x.doc); c.days.add(Number(x.date.slice(8))); c.types.add(x.type); m.set(x.code, c)
          })
          const list = Array.from(m.values()).sort((a, b) => (a.code < b.code ? -1 : 1))
          if (!list.length) return
          cnt += list.length
          const tp = list.reduce((a, x) => a + (x.packs || 0), 0)
          rows.push({ sec: t[1] + ' · ' + list.length + ' รหัส · รวม ' + fmtNum(r2(tp)) + ' แพ็ค' + (t[0] === 'OTHER' ? ' (' + Array.from(new Set(list.flatMap((x) => Array.from(x.types)))).join(', ') + ')' : '') })

        })

        return {
          kicker: 'SAP STOCK MOVEMENT', title: 'สรุปความเคลื่อนไหวสินค้าแยกประเภท', sub: 'สาขา' + SESSION_BRANCH().name + ' · แปลงจำนวนเป็นแพ็คตามฐานสินค้า (รวมทุก Batch แล้ว)',

          cols: [{ h: 'ลำดับ', cls: 'c', w: '5%' }, { h: 'รหัสสินค้า', cls: 'code', w: '10%' }, { h: 'ชื่อสินค้า' }, { h: 'แพ็คไซต์', w: '10%' }, { h: 'SAP (หน่วยเดิม)', cls: 'n', w: '11%' }, { h: 'แพ็ค', cls: 'n', w: '8%' }, { h: 'เอกสาร', cls: 'c', w: '7%' }, { h: 'วันที่', w: '9%' }],
          rows: rows,
          summary: 'แถวไฮไลต์ = แปลงเป็นแพ็คไม่ได้ (รหัสยังไม่มีในฐานสินค้า หรือแพ็คไซต์ไม่มีน้ำหนัก) — เพิ่ม/แก้ในแท็บ ฐานสินค้า แล้วจะแปลงได้เอง',

  function sapmBanner() {
    if (!SAPM_ON || !SAPM.rows.length || CFG.EXPIRY) return ''
    let h = ''
    if (CFG.MODE === 'receive') {
      const R = trRecon(todayKey())
      if (R && R.nRecv) h += '<button type="button" class="sap-ban ' + (R.bad ? 'bad' : 'ok') + '" data-act="sap-tr">' + (R.bad ? '⚠️ รับของวันนี้ไม่ตรงกับใบโอน SAP <b>' + R.bad + ' รายการ</b> — แตะเพื่อดู / พิมพ์' : '✔ รับของวันนี้ตรงกับใบโอน SAP ครบ ' + R.rows.length + ' รายการ') + '</button>'
      else if (R) h += '<button type="button" class="sap-ban info" data-act="sap-tr">🚚 มีใบโอนจากคลัง ' + R.docs.join(', ') + ' (' + R.rows.length + ' รหัส) — นับรับแล้วแตะเพื่อตรวจ</button>'
    }
    if (CFG.MODE === 'return') {
      const G = giRecon(entries.filter((e) => SESSION && e.branchId === SESSION.branchId))
      if (G.bad || G.extra.length) h += '<button type="button" class="sap-ban bad" data-act="sap-gi">⚠️ GI ใน SAP ไม่ตรงกับการตีคืน <b>' + (G.bad + G.extra.length) + ' รายการ</b> — แตะเพื่อดู</button>'
      else if (G.wait) { const old = Math.max.apply(null, G.rounds.filter((r) => r.wait).map((r) => r.age)); h += '<button type="button" class="sap-ban info" data-act="sap-gi">⏳ รอคลังทำ GI ' + G.wait + ' รายการ (นานสุด ' + old + ' วัน · เตือนเมื่อเกิน ' + GI_WAIT + ' วัน)</button>' }
    }
    return h
  }

      '<button type="button" class="btn btn-secondary btn-block" data-act="sap-read">อ่านข้อมูลที่วาง</button><div id="sap-preview" style="margin-top:12px"></div></div>'
    const f = $('#sap-file')
    f.onchange = async () => {
      if (!f.files[0]) return
      $('#sap-preview').textContent = 'กำลังอ่านไฟล์…'
      try { sapShowDraft(sapmParse(await readFile(f.files[0]))) } catch (e) { $('#sap-preview').innerHTML = '<div class="err">' + esc(e.message) + '</div>' }
    }
  }
  function sapShowDraft(d) {
    sapDraft = d
    const box = $('#sap-preview')
    if (!box) return
    if (!d.rows.length) { box.innerHTML = '<div class="err">ไม่พบข้อมูล — ต้องมีคอลัมน์ รหัสสินค้า / วันที่เอกสาร / ประเภทเอกสาร (คัดลอกรวมแถวหัวตาราง)</div>'; return }
    const cnt = {}
    d.rows.forEach((x) => { cnt[x.type] = (cnt[x.type] || 0) + 1 })
    const noConv = Array.from(new Set(d.rows.filter((x) => packsOf(x).p == null).map((x) => x.code)))
    const bn = SESSION_BRANCH().name
    const whWarn = d.whs.length && !d.whs.some((w) => w.indexOf(bn) >= 0 || w.replace(/\s/g, '').indexOf(bn.replace(/\s/g, '')) >= 0)
    box.innerHTML =
      '<div class="sap-prev"><b>อ่านได้ ' + d.lines + ' บรรทัด → รวม Batch แล้ว ' + d.rows.length + ' รายการ</b><br>วันที่ ' + dShort(d.from) + ' – ' + dShort(d.to) + '<br>' +
      Object.keys(cnt).map((k) => esc(k) + ' ' + cnt[k]).join(' · ') +
      (d.whs.length ? '<br>คลัง: ' + esc(d.whs.join(', ')) : '') + '</div>' +
      (whWarn ? '<div class="err">⚠️ ชื่อคลังในไฟล์ไม่ตรงกับสาขา' + esc(bn) + ' — ตรวจว่าดึงข้อมูลถูกสาขา</div>' : '') +
      (noConv.length ? '<div class="sap-warn">แปลงเป็นแพ็คไม่ได้ ' + noConv.length + ' รหัส: ' + esc(noConv.slice(0, 8).join(', ')) + (noConv.length > 8 ? ' …' : '') + ' (ยังไม่มีในฐานสินค้า — บันทึกได้ เพิ่มในฐานภายหลังแล้วจะแปลงเอง)</div>' : '') +
      (d.bad ? '<div class="sap-warn">ข้าม ' + d.bad + ' บรรทัดที่อ่านวันที่ไม่ได้</div>' : '') +
      '<button type="button" class="btn btn-primary btn-block" data-act="sap-save" style="margin-top:10px">☁️ บันทึกลงชีต (' + d.rows.length + ' รายการ)</button>'
  }
  async function sapSave() {
    if (!sapDraft || !sapDraft.rows.length) return
    const btn = document.querySelector('[data-act=sap-save]')
    if (btn) { btn.disabled = true; btn.textContent = 'กำลังบันทึก…' }
    try {
      const r = await sapApi('saveSapMoves', { by: SESSION.user, rows: sapDraft.rows })
      toast('บันทึกแล้ว: ใหม่ ' + r.added + ' · แทนที่ ' + r.updated + ' รายการ')
      sapDraft = null
      await sapmFetch(true)
      view = 'sap'; render()
      if (CFG.MODE === 'receive' && trDocsFor(todayKey()).length) setTimeout(() => toast('🚚 มีใบโอนของวันนี้ — นับรับเสร็จแล้วกด ① ตรวจรับของโอนย้าย', 'ok', 4500), 1600)
    } catch (e) { toast('บันทึกไม่สำเร็จ: ' + e.message, 'err', 4500); if (btn) { btn.disabled = false; btn.textContent = '☁️ ลองบันทึกอีกครั้ง' } }
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', async (ev) => {
    const el = ev.target.closest('[data-act]')
    if (!el) return
    const act = el.getAttribute('data-act')
    const id = el.getAttribute('data-id')
    if (act === 'login') doLogin()
    else if (act === 'pin-key') pinPress(el.getAttribute('data-k'))
    else if (act === 'tab-main') { view = 'main'; render() }
    else if (act === 'back') { view = 'main'; render() }
    else if (act === 'logout') confirmBox('ออกจากระบบ', 'รายการที่บันทึกไว้ยังอยู่ ออกจากระบบตอนนี้ได้', 'ออกจากระบบ', () => { closeScanner(); lsSet(K.session, null); view = 'login'; render() })
    else if (act === 'scan') openScanner()
    else if (act === 'scan-close') closeScanner()
    else if (act === 'scan-code') openCodeModal()
    else if (act === 'code') openCodeModal()
    else if (act === 'pick-date') { selDate = el.getAttribute('data-d'); render() }
    else if (act === 'products') { view = 'products'; render() }
    else if (act === 'sapm') { view = 'sap'; render(); sapmFetch(true) }
    else if (act === 'sap-read') { const t = $('#sap-paste').value; if (!t.trim()) { toast('ยังไม่ได้วางข้อมูล', 'err'); return } sapShowDraft(sapmParse(parseDelimited(t))) }
    else if (act === 'sap-save') sapSave()
    else if (act === 'sap-reload') { await sapmFetch(false); toast('โหลดข้อมูล SAP ล่าสุดแล้ว') }
    else if (act === 'sap-tr') printTransfer()
    else if (act === 'sap-gi') printGi()
    else if (act === 'issues') openIssues()
    else if (act === 'sap-ty') printSapTypes()
    else if (act === 'p-read') readPasted()
    else if (act === 'p-save') saveDraft()
    else if (act === 'p-add') addOne()
    else if (act === 'p-del') {
      const c = id
      confirmBox('ยกเลิกสินค้าที่รอซิงก์', 'ยกเลิกการเพิ่ม/แก้ ' + c + ' (ยังไม่ได้ขึ้นชีต)?', 'ตกลง', () => { delete extra[c]; delete PEND[c]; lsSet(K.pend, PEND); saveProducts(); render() })
    }
    else if (act === 'xlsx') exportExcel()
    else if (act === 'csv') exportCsv()
    else if (act === 'history') openHistory()
    else if (act === 'print') printEntries()
    else if (act === 'store-sum') openStoreSummary()
    else if (act === 'move') {
      const e = entries.find((x) => x.id === id)
      if (e) confirmBox('↩️ ส่งไปแอปตีคืน', 'ส่ง ' + (e.name || e.code) + ' × ' + fmtNum(e.qty) + ' ไปบันทึกในแอปตีคืน (เหตุผล: คุณภาพไม่ได้มาตรฐาน)? รายการรับเข้ายังอยู่ แต่จะมีเครื่องหมายว่าส่งแล้ว', 'ส่งไปตีคืน', () => { moveToReturn(e) })
    }
    else if (act === 'exp-add') openQuickQty(el.getAttribute('data-code'))
    else if (act === 'del-code') {
      const c = el.getAttribute('data-code'), ls = lotsOfCode(c)
      if (ls.length) confirmBox('ลบทุกล็อต', 'ลบ ' + (ls[0].name || c) + ' ทั้งหมด ' + ls.length + ' ล็อต ออกจากทะเบียน? (ลบจากทุกเครื่อง · ในชีตเก็บสำเนาไว้ที่แท็บ ถังขยะ)', 'ลบทั้งหมด', () => { removeEntries(ls.map((e) => e.id)); render() })
    }
    else if (act === 'exp-ret') openExpRet()
    else if (act === 'exp-filter') { expFilter = el.getAttribute('data-f'); render() }
    else if (act === 'clear-expired') {
      const g = myEntries().filter((e) => { const d = daysLeft(e.exp); return d != null && d < 0 })
      confirmBox('🧹 ล้างสินค้าที่หมดอายุแล้ว', 'ลบ ' + g.length + ' รายการที่หมดอายุแล้วออกจากทะเบียน (ทุกเครื่องและในชีต)?', 'ลบออก', () => { removeEntries(g.map((x) => x.id)); toast('ล้างแล้ว ' + g.length + ' รายการ'); render() })
    }
    else if (act === 'edit') { const e = entries.find((x) => x.id === id); if (e) openEntryModal(e.code, e) }
    else if (act === 'del') {
      const e = entries.find((x) => x.id === id)
      if (e) confirmBox('ลบรายการ', 'ลบ ' + (e.name || e.code) + ' × ' + fmtNum(e.qty) + ' ? (ลบจากทุกเครื่อง · ในชีตเก็บสำเนาไว้ที่แท็บ ถังขยะ)', 'ลบ', () => { removeEntries([id]); render() })
    }
    else if (act === 'sync-now') { await syncEntries(); if (SY.state === 'ok') toast('ซิงก์แล้ว'); else if (SY.state === 'err') toast(SY.msg, 'err', 3500) }
    else if (act === 'send-ret') {
      const list = myEntries('pending')
      if (!list.length) return
      const tot = list.reduce((a, e) => a + e.qty, 0)
      confirmBox('📤 ส่งคืนคลัง', 'ปิดรอบตีคืน ' + list.length + ' รายการ (รวม ' + fmtNum(tot) + ' ชิ้น) เป็น "ส่งคืนคลังแล้ว" วันนี้ แล้วเปิดใบส่งคืนให้พิมพ์ — ข้อมูลยังอยู่ในชีตและดูย้อนหลังได้', 'ส่งคืน + พิมพ์', () => {
        const d = todayKey()
        list.forEach((e) => { e.sent = d; e.u = nowT(); SYS.dirty[e.id] = 1 })
        saveEntries(); saveSys(); scheduleSync(200)
        selDate = d; render(); toast('ส่งคืนคลังแล้ว ' + list.length + ' รายการ')
        setTimeout(printEntries, 250)
      })
    }
    else if (act === 'unsend') {
      const list = myEntries()
      confirmBox('↩ ย้อนเป็นรอส่ง', 'ย้ายรายการ ' + list.length + ' รายการ กลับไปเป็น "รอส่งคืนคลัง"?', 'ย้อนกลับ', () => {
        list.forEach((e) => { e.sent = ''; e.u = nowT(); SYS.dirty[e.id] = 1 })
        saveEntries(); saveSys(); scheduleSync(200); selDate = 'pending'; render()
      })
    }
    else if (act === 'clear-day') {
      const list = myEntries()
      if (!list.length) { toast('ไม่มีรายการให้ล้าง'); return }
      const dl = RET ? 'ที่รอส่งคืน' : selDate === todayKey() ? 'วันนี้' : 'วันที่ ' + selDate
      confirmBox('🧹 ล้างรายการ' + dl, 'ลบรายการ' + CFG.SHEET + dl + ' ของสาขา' + SESSION_BRANCH().name + ' ทั้งหมด ' + list.length + ' รายการ — จะหายจากทุกเครื่อง (ในชีตเก็บสำเนาไว้ที่แท็บ ถังขยะ)', 'ล้างรายการ', () => { removeEntries(list.map((x) => x.id)); toast('ล้างรายการแล้ว'); render() })
    }
  })

  pruneEntries()
  saveEntries()
  saveSys()
  if (getSession()) { view = 'main'; SESSION = getSession() } // เปิดใหม่/รีเฟรชแล้วยังล็อกอินอยู่ ไม่ต้องล็อกอินซ้ำ
  if (SAPM_ON && SESSION) { sapmLoadCache(); setTimeout(() => sapmFetch(true), 1500) }
  render()
  syncEntries()
  setInterval(() => { if (!document.hidden && SESSION) syncEntries() }, 20000)
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncEntries(); else flushBeacon() })
  window.addEventListener('pagehide', flushBeacon)
  window.addEventListener('online', () => syncEntries())
  if (window.__RC_TEST) window.__RC = { entries: () => entries, products: () => products, matchCodes: matchCodes, printEntries: printEntries, openStoreSummary: openStoreSummary, daysLeft: daysLeft, moveToReturn: moveToReturn, openQuickQty: openQuickQty, syncEntries: syncEntries, SYS: () => SYS, SRV: () => SRV, PEND: () => PEND, SY: SY, resolveCode: resolveCode, openCodeModal: openCodeModal, buildXlsx: buildXlsx, readXlsx: readXlsx, parseDelimited: parseDelimited, rowsToProducts: rowsToProducts, sapmParse: sapmParse, toPacks: toPacks, trRecon: trRecon, giRecon: giRecon, SAPM: () => SAPM, sapmFetch: sapmFetch, readFile: readFile }
})()

</script>
<script>
/* ชื่อผู้ใช้ล่าสุด สาขาละ 3 ชื่อ (ใช้ร่วมกันทุกแอปในเว็บเดียวกัน) */
(function () {
  var K = 'br_recent_names'
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
  function load() { try { return JSON.parse(localStorage.getItem(K) || '{}') || {} } catch (e) { return {} } }
  window.__pushRecentName = function (bid, n) {
    n = String(n || '').trim()
    if (!bid || !n) return
    var m = load()
    var a = (m[bid] || []).filter(function (x) { return x !== n })
    a.unshift(n)
    m[bid] = a.slice(0, 3)
    try { localStorage.setItem(K, JSON.stringify(m)) } catch (e) {}
  }
  function draw() {
    var inp = document.getElementById('lg-name'), sel = document.getElementById('lg-branch')
    if (!inp || !sel) return
    var box = document.getElementById('lg-recent')
    if (!box) {
      box = document.createElement('div'); box.id = 'lg-recent'; box.className = 'rn-chips'
      var lab = inp.closest('label') || inp.parentNode
      lab.parentNode.insertBefore(box, lab.nextSibling)
    }
    var a = load()[sel.value] || []
    box.innerHTML = a.length ? '<span>ชื่อล่าสุด' + (sel.value ? '' : '') + ':</span>' + a.map(function (n) { return '<button type="button" class="rn-chip" data-rn="' + esc(n) + '">' + esc(n) + '</button>' }).join('') : ''
    box.hidden = !a.length
  }
  document.addEventListener('change', function (e) { if (e.target && e.target.id === 'lg-branch') setTimeout(draw, 0) })
  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest ? e.target.closest('.rn-chip') : null
    if (!b) return
    e.preventDefault()
    var inp = document.getElementById('lg-name')
    if (inp) { inp.value = b.getAttribute('data-rn'); inp.dispatchEvent(new Event('input', { bubbles: true })) }
  }, true)
  new MutationObserver(function () { if (document.getElementById('lg-name') && !document.getElementById('lg-recent')) draw() }).observe(document.body, { childList: true, subtree: true })
  var st = document.createElement('style')
  st.textContent = '.rn-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px;font-size:13px;color:#5f7f5f;font-weight:700}.rn-chip{border:1.5px solid #b8dfc8;background:#e8f5ee;color:#145f2f;border-radius:99px;padding:5px 12px;font:inherit;font-weight:800;cursor:pointer;min-height:34px}.rn-chip:active{transform:scale(.96)}'
  document.head.appendChild(st)
})()
</script>

<script>
/* IssueKit — ทะเบียนปัญหา: เปิดเคสเมื่อของไม่ตรง (โอนผิด / GI ไม่ตรง / ปรับสต๊อกผิด) ระบุแผนกที่รับผิดชอบ และติดตามสถานะจนปิด
   ทุกการเปลี่ยนแปลงบันทึกในช่อง "ประวัติ" (ใคร · เมื่อไร · เปลี่ยนอะไร) — ไม่มีการแก้ทับเงียบ ๆ */
window.IssueKit = (function () {
  var TYPES = ['โอนขาด', 'โอนเกิน', 'โอนผิดรหัส', 'ไม่มีใบโอน / รับนอกใบโอน', 'GI ไม่ตรงกับตีคืน', 'ยังไม่ทำ GI เกินกำหนด', 'ปรับสต๊อกผิด', 'ยังไม่ปรับสต๊อก', 'สินค้าเสีย / ไม่ได้คุณภาพ', 'อื่น ๆ']
  var DEPTS = ['คลังสินค้า', 'สาขา', 'จัดซื้อ', 'บัญชี', 'ขนส่ง', 'ซัพพลายเออร์', 'ยังไม่ทราบ']
  var STATUS = ['เปิด', 'แจ้งแผนกแล้ว', 'แผนกแก้แล้ว รอตรวจ', 'ปิดเคส']
  var cfg = null, ov = null, list = [], tab = 'open'
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
  var num = function (v) { return v === '' || v == null || isNaN(Number(v)) ? '' : String(Math.round(Number(v) * 1000) / 1000) }
  var dTH = function (k) { var p = String(k || '').slice(0, 10).split('-'); return p.length === 3 ? Number(p[2]) + '/' + Number(p[1]) + '/' + p[0] : String(k || '') }
  var stIx = function (s) { var i = STATUS.indexOf(s); return i < 0 ? 0 : i }
  function msg(t, err) { if (cfg && cfg.toast) cfg.toast(t, err ? 'err' : 'ok', err ? 4000 : 2500); else alert(t) }
  function init(c) { cfg = c }
  function shell(title, body, foot) {
    close()
    ov = document.createElement('div')
    ov.id = 'ik-ov'
    ov.innerHTML = '<div class="ik-bar"><b>' + title + '</b>' + (foot ? '' : '<button type="button" class="ik-add" data-ik="add">➕ เปิดเคส</button><button type="button" data-ik="print">🖨️ / 📗</button>') + '<button type="button" data-ik="close">ปิด</button></div>' +
      '<div class="ik-body"><div class="ik-wrap">' + body + '</div></div>' + (foot || '')
    document.body.appendChild(ov)
    ov.addEventListener('click', onClick)
    return ov
  }
  function close() { if (ov) { ov.remove(); ov = null } }
  async function load() {
    var d = await cfg.call('issueList', {})
    list = (d && d.items) || []
  }
  async function open() {
    if (!cfg) return
    shell('📌 ทะเบียนปัญหา', '<div class="ik-empty">กำลังโหลด…</div>')
    try { await load() } catch (e) { ov.querySelector('.ik-wrap').innerHTML = '<div class="ik-empty">โหลดไม่สำเร็จ: ' + esc(e.message) + '</div>'; return }
    draw()
  }
  function draw() {
    if (!ov) return
    var open = list.filter(function (x) { return x.status !== 'ปิดเคส' })
    var show = tab === 'open' ? open : tab === 'closed' ? list.filter(function (x) { return x.status === 'ปิดเคส' }) : list
    show = show.slice().sort(function (a, b) { return stIx(a.status) - stIx(b.status) || String(b.openedAt).localeCompare(String(a.openedAt)) })
    var byDept = {}
    open.forEach(function (x) { byDept[x.dept || 'ยังไม่ทราบ'] = (byDept[x.dept || 'ยังไม่ทราบ'] || 0) + 1 })
    var h = '<div class="ik-tabs"><button type="button" data-ik="tab:open" class="' + (tab === 'open' ? 'on' : '') + '">ยังไม่ปิด (' + open.length + ')</button><button type="button" data-ik="tab:closed" class="' + (tab === 'closed' ? 'on' : '') + '">ปิดแล้ว</button><button type="button" data-ik="tab:all" class="' + (tab === 'all' ? 'on' : '') + '">ทั้งหมด</button></div>'
    if (open.length) h += '<div class="ik-sub">เคสค้างตามแผนก: ' + Object.keys(byDept).map(function (k) { return '<span class="ik-tag">' + esc(k) + ' ' + byDept[k] + '</span>' }).join('') + '</div>'
    if (cfg.sources && cfg.sources.length) h += '<button type="button" class="ik-src" data-ik="src">🔎 ดึงรายการที่ไม่ตรงจากผลตรวจ มาเปิดเคส<small>' + cfg.sources.map(function (s) { return esc(s.label) }).join(' · ') + '</small></button>'
    if (!show.length) h += '<div class="ik-empty">' + (tab === 'open' ? 'ไม่มีเคสค้าง 👍' : 'ไม่มีเคส') + '</div>'
    show.forEach(function (x) {
      var s = stIx(x.status) + 1, diff = x.expect !== '' && x.actual !== '' ? Math.round((Number(x.actual) - Number(x.expect)) * 1000) / 1000 : ''
      h += '<div class="ik-card s' + s + '" data-id="' + esc(x.id) + '"><div class="ik-h"><b>' + esc(x.code) + ' ' + esc(x.name) + '</b><span><span class="ik-tag st' + s + '">' + esc(x.status) + '</span><span class="ik-tag">' + esc(x.id) + '</span></span></div>' +
        '<div class="ik-sub"><span class="ik-tag">' + esc(x.type) + '</span>' + (x.doc ? 'เอกสาร ' + esc(x.doc) + ' ' : '') + (x.docDate ? '· ลงวันที่ ' + dTH(x.docDate) + ' ' : '') + '· เปิดเมื่อ ' + esc(x.openedAt) + ' โดย ' + esc(x.openedBy) + '</div>' +
        (x.expect !== '' || x.actual !== '' ? '<div class="ik-nums"><span>ควรเป็น <b>' + num(x.expect) + '</b></span><span>จริง <b>' + num(x.actual) + '</b></span>' + (diff !== '' ? '<span>ต่าง <b style="color:' + (diff ? '#b3261e' : '#1a7a3c') + '">' + (diff > 0 ? '+' : '') + num(diff) + '</b></span>' : '') + '</div>' : '') +
        (x.detail ? '<div class="ik-sub">📝 ' + esc(x.detail) + '</div>' : '') +
        '<div class="ik-row"><div><label>แผนกที่รับผิดชอบ</label><select data-f="dept">' + DEPTS.map(function (d) { return '<option' + (d === (x.dept || 'ยังไม่ทราบ') ? ' selected' : '') + '>' + esc(d) + '</option>' }).join('') + '</select></div>' +
        '<div><label>สถานะ</label><select data-f="status">' + STATUS.map(function (d) { return '<option' + (d === x.status ? ' selected' : '') + '>' + esc(d) + '</option>' }).join('') + '</select></div></div>' +
        '<div style="margin-top:8px"><label>บันทึกเพิ่ม (เช่น แจ้งใคร · เลขที่เอกสารแก้ไข)</label><input data-f="note" placeholder="จะต่อท้ายในประวัติ ไม่ลบของเดิม"></div>' +
        '<button type="button" class="ik-save" data-ik="save">💾 บันทึก</button>' +
        (x.history ? '<div class="ik-hist">' + esc(x.history) + '</div>' : '') + '</div>'
    })
    ov.querySelector('.ik-wrap').innerHTML = h
  }
  async function save(card) {
    var id = card.getAttribute('data-id'), x = list.find(function (i) { return i.id === id })
    var dept = card.querySelector('[data-f=dept]').value, status = card.querySelector('[data-f=status]').value, note = card.querySelector('[data-f=note]').value.trim()
    if (x && dept === (x.dept || 'ยังไม่ทราบ') && status === x.status && !note) { msg('ยังไม่มีอะไรเปลี่ยน'); return }
    try {
      var d = await cfg.call('issueSave', { items: [{ id: id, dept: dept, status: status, note: note }] })
      ;(d.items || []).forEach(function (n) { var i = list.findIndex(function (y) { return y.id === n.id }); if (i >= 0) list[i] = n })
      msg('บันทึกแล้ว'); draw()
    } catch (e) { msg('บันทึกไม่สำเร็จ: ' + e.message, true) }
  }
  function addForm(pre) {
    pre = pre || {}
    var f = function (k, lab, ph, type) { return '<div><label>' + lab + '</label><input data-n="' + k + '" ' + (type ? 'type="' + type + '" inputmode="decimal" ' : '') + 'value="' + esc(pre[k] == null ? '' : pre[k]) + '" placeholder="' + esc(ph || '') + '"></div>' }
    var sel = function (k, lab, arr, v) { return '<div><label>' + lab + '</label><select data-n="' + k + '">' + arr.map(function (d) { return '<option' + (d === v ? ' selected' : '') + '>' + esc(d) + '</option>' }).join('') + '</select></div>' }
    var body = '<div class="ik-card s1"><div class="ik-row">' + sel('type', 'ประเภทปัญหา', TYPES, pre.type || TYPES[0]) + sel('dept', 'แผนกที่รับผิดชอบ', DEPTS, pre.dept || 'คลังสินค้า') + '</div>' +
      '<div class="ik-row">' + f('code', 'รหัสสินค้า', 'FG01002') + f('name', 'ชื่อสินค้า', '') + '</div>' +
      '<div class="ik-row">' + f('doc', 'เลขที่เอกสาร SAP', 'เช่น TR / GI / IA') + f('docDate', 'วันที่เอกสาร', '', 'date') + '</div>' +
      '<div class="ik-row">' + f('expect', 'ควรเป็น (แพค)', '', 'number') + f('actual', 'ได้จริง (แพค)', '', 'number') + '</div>' +
      '<div style="margin-top:8px"><label>รายละเอียด</label><textarea data-n="detail" rows="3" placeholder="เกิดอะไรขึ้น · หลักฐาน">' + esc(pre.detail || '') + '</textarea></div></div>'
    shell('➕ เปิดเคสใหม่', body, '<div class="ik-foot"><button type="button" class="ik-ghost" data-ik="back">ย้อนกลับ</button><button type="button" class="ik-go" data-ik="create">💾 เปิดเคส</button></div>')
    var dd = ov.querySelector('[data-n=docDate]'); if (dd) dd.removeAttribute('inputmode')
  }
  async function createFromForm() {
    var it = {}
    ov.querySelectorAll('[data-n]').forEach(function (el) { it[el.getAttribute('data-n')] = el.value.trim() })
    if (!it.code && !it.detail) { msg('ใส่รหัสสินค้า หรือรายละเอียด อย่างน้อย 1 อย่าง', true); return }
    it.code = it.code.toUpperCase()
    await createMany([it])
  }
  async function createMany(items) {
    try {
      var d = await cfg.call('issueSave', { items: items })
      msg('เปิดเคสแล้ว ' + (d.created || 0) + ' เคส' + (d.skipped ? ' · ซ้ำกับเคสที่ยังเปิดอยู่ ' + d.skipped : ''))
      tab = 'open'; await open()
    } catch (e) { msg('เปิดเคสไม่สำเร็จ: ' + e.message, true) }
  }
  // เลือกรายการที่ไม่ตรง (จากผลตรวจ) มาเปิดเคส
  var picks = []
  function pick(title, items) {
    picks = items || []
    var body = picks.length ? '<div class="ik-sub">ติ๊กรายการที่จะเปิดเคส · รายการที่มีเคสเปิดอยู่แล้วจะไม่ซ้ำ</div>' + picks.map(function (x, i) {
      return '<label class="ik-pick"><input type="checkbox" data-p="' + i + '" checked><span><b>' + esc(x.code) + ' ' + esc(x.name || '') + '</b><br><span class="ik-tag">' + esc(x.type) + '</span>' + (x.doc ? 'เอกสาร ' + esc(x.doc) + ' ' : '') + (x.docDate ? '· ' + dTH(x.docDate) : '') +
        (x.expect !== undefined ? '<br>ควรเป็น <b>' + num(x.expect) + '</b> · จริง <b>' + num(x.actual) + '</b>' : '') + (x.detail ? '<br><small>' + esc(x.detail) + '</small>' : '') + '</span></label>'
    }).join('') : '<div class="ik-empty">ไม่พบรายการที่ไม่ตรง 👍</div>'
    shell('🔎 ' + esc(title), body, '<div class="ik-foot"><button type="button" class="ik-ghost" data-ik="back">ย้อนกลับ</button>' + (picks.length ? '<button type="button" class="ik-go" data-ik="createPicked">📌 เปิดเคสที่เลือก</button>' : '') + '</div>')
  }
  function chooseSource() {
    var body = cfg.sources.map(function (s, i) { return '<button type="button" class="ik-src" data-ik="srcgo:' + i + '">' + esc(s.label) + (s.hint ? '<small>' + esc(s.hint) + '</small>' : '') + '</button>' }).join('')
    shell('🔎 ดึงจากผลตรวจ', body, '<div class="ik-foot"><button type="button" class="ik-ghost" data-ik="back">ย้อนกลับ</button></div>')
  }
  function printList() {
    if (!window.PrintKit) return
    var rowsOf = function (mode) { return list.filter(function (x) { return mode === 'all' || x.status !== 'ปิดเคส' }).sort(function (a, b) { return String(a.openedAt).localeCompare(String(b.openedAt)) }) }
    window.PrintKit.open({
      name: 'ทะเบียนปัญหา', options: [['open', 'เฉพาะเคสที่ยังไม่ปิด'], ['all', 'ทุกเคส']],
      build: function (mode) {
        var L = rowsOf(mode)
        return {
          kicker: 'ISSUE LOG', title: 'ทะเบียนปัญหา / เคสผิดพลาดระหว่างแผนก', sub: (cfg.branch ? 'สาขา' + cfg.branch() + ' · ' : '') + (mode === 'all' ? 'ทุกเคส' : 'เฉพาะเคสที่ยังไม่ปิด'),
          meta: [['สาขา', cfg.branch ? cfg.branch() : ''], ['จำนวนเคส', L.length + ' เคส'], ['ผู้พิมพ์', cfg.user ? cfg.user() : '']],
          cols: [{ h: 'เลขที่เคส', cls: 'code', w: '10%' }, { h: 'เปิดเมื่อ', w: '10%' }, { h: 'ประเภท', w: '11%' }, { h: 'เอกสาร', w: '10%' }, { h: 'สินค้า' }, { h: 'ควรเป็น', cls: 'n', w: '6%' }, { h: 'จริง', cls: 'n', w: '6%' }, { h: 'แผนก', w: '9%' }, { h: 'สถานะ', w: '10%' }],
          rows: L.map(function (x) { return { hl: x.status === 'เปิด', cells: [x.id, x.openedAt, x.type, (x.doc || '') + (x.docDate ? ' ' + dTH(x.docDate) : ''), x.code + ' ' + x.name + (x.detail ? ' — ' + x.detail : ''), num(x.expect), num(x.actual), x.dept, x.status] } }),
          noteBox: 'หมายเหตุ:', sign: ['ผู้จัดทำ (สาขา)', 'ผู้รับทราบ (แผนกที่รับผิดชอบ)', 'ผู้จัดการสาขา'], footRight: 'ทะเบียนปัญหา', empty: 'ไม่มีเคส'
        }
      }
    })
  }
  async function onClick(e) {
    var t = e.target.closest('[data-ik]'); if (!t) return
    var a = t.getAttribute('data-ik')
    if (a === 'close') close()
    else if (a === 'back') open()
    else if (a === 'add') addForm()
    else if (a === 'create') createFromForm()
    else if (a === 'print') { close(); printList() }
    else if (a.indexOf('tab:') === 0) { tab = a.slice(4); draw() }
    else if (a === 'save') save(t.closest('.ik-card'))
    else if (a === 'src') chooseSource()
    else if (a.indexOf('srcgo:') === 0) {
      var s = cfg.sources[Number(a.slice(6))]
      t.disabled = true; t.textContent = 'กำลังตรวจ…'
      try { pick(s.label, await s.get()) } catch (err) { msg('ตรวจไม่สำเร็จ: ' + err.message, true); chooseSource() }
    } else if (a === 'createPicked') {
      var sel = []
      ov.querySelectorAll('[data-p]').forEach(function (c) { if (c.checked) sel.push(picks[Number(c.getAttribute('data-p'))]) })
      if (!sel.length) { msg('ยังไม่ได้เลือกรายการ', true); return }
      t.disabled = true
      await createMany(sel)
    }
  }
  return { init: init, open: open, pick: pick, close: close, TYPES: TYPES, DEPTS: DEPTS }
})()
</script>

</body>
</html>
