<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2e1a">
<title>ตีคืนสินค้า</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { color-scheme: only light; }
input, select, textarea { color-scheme: only light; }


:root {
  --bg: #f0f4f0;
  --surface: #ffffff;
  --surface2: #f5f8f5;
  --border: #d0dcd0;
  --border2: #e3eae3;
  --green: #1a7a3c;
  --green-l: #e8f5ee;
  --green-m: #b8dfc8;
  --green-dk: #145f2f;
  --green-btn: #22a050;
  --df-green: #1a4a2e;
  --df-green-mid: #22683f;
  --df-green-btn: #2d8a52;
  --deep: #0d2e1a;
  --yellow: #b07800;
  --yellow-l: #fff8e0;
  --red: #c0392b;
  --red-l: #fdecea;
  --blue: #1a5fa0;
  --blue-l: #e8f0fa;
  --text: #1a2a1a;
  --muted: #5f7f5f;
  --dim: #9aaa9a;
  --r: 12px;
  --r2: 9px;
  --sh: 0 2px 8px rgba(0, 60, 20, 0.1);
  --sh2: 0 4px 20px rgba(0, 60, 20, 0.14);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --ease: cubic-bezier(0.2, 0.9, 0.3, 1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { margin: 0; line-height: 1.25; }
:focus-visible { outline: 3px solid var(--green-btn); outline-offset: 2px; }

/* ---------- Keyframes (ชุดเดียวกับ POS อ้างอิง) ---------- */
@keyframes modalIn { from { transform: translateY(22px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes popDown { from { transform: translateY(-8px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes slideUp { from { transform: translateY(22px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
@keyframes spinIn { 0% { transform: rotate(-180deg) scale(0); opacity: 0; } 60% { transform: rotate(20deg) scale(1.2); } 80% { transform: rotate(-8deg) scale(0.95); } 100% { transform: none; opacity: 1; } }
@keyframes countUp { 0% { transform: translateY(16px) scale(0.8); opacity: 0; } 70% { transform: translateY(-4px) scale(1.05); } 100% { transform: none; opacity: 1; } }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); } }
@keyframes rowFlash { from { background: #bfe9cc; box-shadow: inset 5px 0 0 var(--df-green-btn); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes floatLeaf { 0% { opacity: 0; transform: translateY(100vh) rotate(0deg) scale(0.8); } 10% { opacity: 0.5; } 90% { opacity: 0.3; } 100% { opacity: 0; transform: translateY(-120px) rotate(360deg) scale(1); } }
@keyframes fruitBob { from { transform: translateY(var(--fy, 0px)) rotate(-4deg) scale(1); } to { transform: translateY(calc(var(--fy, 0px) - 12px)) rotate(4deg) scale(1.04); } }
@keyframes fruitShakeFast { from { transform: rotate(-8deg) scale(1.05); } to { transform: rotate(8deg) scale(1.1); } }

/* ---------- โครงหน้า: topbar / tabs / content / dock แยกกันชัด ไม่มี fixed ลอยทับเนื้อหา ---------- */
#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; background: var(--bg); box-shadow: 0 0 40px rgba(0, 40, 15, 0.12); }

.topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  color: #fff;
  background: linear-gradient(135deg, #0d2e1a 0%, #1a4a2e 60%, #22683f 100%);
  box-shadow: 0 2px 12px rgba(0, 30, 10, 0.4);
  position: relative;
  z-index: 5;
}
.tb-logo { flex: none; width: 40px; height: 40px; border-radius: 12px; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25); display: grid; place-items: center; font-size: 22px; }
.tb-text { flex: 1; min-width: 0; }
.tb-title { font-size: 18px; font-weight: 800; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-sub { font-size: 12.5px; color: rgba(255, 255, 255, 0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-right { display: flex; gap: 6px; }
.tb-btn { flex: none; width: 40px; height: 40px; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 11px; background: rgba(255, 255, 255, 0.12); color: #fff; font-size: 18px; display: grid; place-items: center; transition: background 0.15s, transform 0.1s; }
.tb-btn:active { background: rgba(255, 255, 255, 0.3); transform: scale(0.94); }

.navtabs { flex: none; display: flex; background: #fff; border-bottom: 2px solid var(--border); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06); position: relative; z-index: 4; }
.navtab { flex: 1; min-height: 46px; padding: 0 2px; border: 0; background: transparent; font-weight: 700; font-size: 13.5px; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; transition: color 0.15s, border-color 0.2s, background 0.2s; }
.navtab:active { background: var(--green-l); }
.navtab.on { color: var(--df-green); border-bottom-color: var(--df-green); background: linear-gradient(180deg, #fff 30%, var(--green-l)); }

body[data-mode='login'] .topbar, body[data-mode='login'] .navtabs, body[data-mode='login'] .dock, body[data-mode='login'] .notice, body[data-mode='plain'] .notice { display: none; }
body[data-mode='plain'] .navtabs, body[data-mode='plain'] .tb-right, body[data-mode='plain'] .tb-logo { display: none; }
body[data-mode='app'] .tb-back { display: none; }

.view { flex: 1; min-height: 0; }
.view.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; }
.view.fill { display: flex; flex-direction: column; overflow: hidden; }
.view.enter { animation: slideUp 0.28s var(--ease) both; }
.view.login.enter { animation: fadeIn 0.4s ease both; }

.dock { flex: none; display: flex; gap: 6px; padding: 10px 12px calc(10px + var(--safe-b)); background: #fff; border-top: 1px solid var(--border); box-shadow: 0 -2px 10px rgba(0, 60, 20, 0.06); position: relative; z-index: 4; }
.dock[hidden] { display: none; }

/* ---------- ปุ่ม ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 16px; border-radius: 11px; border: 2px solid transparent; font-weight: 700; line-height: 1.2; user-select: none; letter-spacing: 0.2px; transition: transform 0.1s ease, box-shadow 0.18s ease, background 0.15s; }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.42; cursor: not-allowed; box-shadow: none; }
.btn-primary { background: linear-gradient(135deg, var(--df-green-btn), var(--df-green)); color: #fff; box-shadow: 0 4px 14px rgba(29, 74, 46, 0.35); }
.btn-secondary { background: #fff; color: var(--green-dk); border-color: var(--green-m); }
.btn-danger { background: var(--red); color: #fff; }
.btn-ghost { background: transparent; color: var(--red); border-color: var(--red-l); }
.btn-block { width: 100%; }
.btn-lg { min-height: 56px; font-size: 18px; }
.dock .btn { flex: 1; padding: 0 4px; font-size: 15px; white-space: nowrap; }
.dock .btn-primary { flex: 1.2; }
.stack { display: flex; flex-direction: column; gap: 10px; }
@media (hover: hover) {
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(29, 74, 46, 0.45); }
  .btn-secondary:hover:not(:disabled) { background: var(--green-l); border-color: var(--green-btn); }
  .act:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--sh2); }
  .row:hover { background: var(--green-l); }
}

/* ---------- เนื้อหาทั่วไป ---------- */
.page-h { font-size: 20px; font-weight: 800; color: var(--df-green); margin: 0 2px 10px; }
.page-sub { margin: -6px 2px 12px; color: var(--muted); font-size: 14px; }
.sec { font-size: 15px; font-weight: 800; color: var(--muted); margin: 18px 2px 8px; }
.muted { color: var(--muted); }
.credit { margin: 22px 0 6px; text-align: center; color: var(--muted); font-size: 14px; }

.field { display: block; margin: 0 0 12px; }
.field > span, .lbl { display: block; font-size: 13.5px; color: #4a6a4a; font-weight: 700; margin-bottom: 5px; }
input[type='text'], input[type='password'], input[type='url'], input[type='search'], select, textarea {
  width: 100%;
  min-height: 46px;
  padding: 9px 13px;
  background: #f4f8f5;
  border: 1.5px solid #c8ddc8;
  border-radius: 10px;
  outline: none;
  transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
}
input:focus, select:focus, textarea:focus { border-color: var(--df-green-btn); background: #fff; box-shadow: 0 0 0 3px rgba(45, 138, 82, 0.14); }
select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 38px;
  font-weight: 600;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%231a7a3c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat;
  background-position: right 14px center;
}
textarea { min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; resize: vertical; }
.search { min-height: 42px; padding: 4px 13px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; box-shadow: var(--sh); }
.card + .card, .card + .stack, .stack + .card, .status + .card { margin-top: 12px; }

.status { border-radius: var(--r); padding: 12px 14px; margin-bottom: 12px; border: 1px solid transparent; animation: cardIn 0.35s var(--ease) both; }
.status b { display: block; font-size: 17px; }
.status.ok { background: var(--green-l); border-color: var(--green-m); color: var(--green-dk); }
.status.warn { background: var(--yellow-l); border-color: #ead38a; color: #6a4a00; }
.status.info { background: var(--blue-l); border-color: #bbd2ec; color: var(--blue); }
.status.err { background: var(--red-l); border-color: #f0b9b2; color: #8a2a20; }
.status .line { font-size: 14px; margin-top: 3px; }
.status button.linkbtn { margin-top: 6px; margin-right: 14px; }
.linkbtn { background: none; border: 0; padding: 9px 0; min-height: 42px; color: var(--green); font-weight: 800; text-decoration: underline; text-align: left; }
.err-box { background: #fff0f0; border: 1px solid #f5b5b0; border-radius: 10px; padding: 8px 12px; color: var(--red); font-size: 14px; font-weight: 600; animation: popDown 0.2s ease both; }
.err-box[hidden] { display: none; }

/* ---------- หน้า Login (แบบ POS: ไล่สี + ผลไม้ลอยสั่น + ใบไม้ปลิว) ---------- */
.view.login { background: linear-gradient(160deg, #0d2e1a 0%, #1a4a2e 45%, #2d6b42 100%); overflow-y: auto; padding: 0; }
.login-screen { position: relative; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 26px 16px 34px; overflow: hidden; }
.fruit-side { position: absolute; pointer-events: none; opacity: 0; font-size: calc(clamp(34px, 11vw, 72px) * var(--k, 1)); filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.25)); animation: fruitBob 2.4s ease-in-out infinite alternate; z-index: 0; }
.fruit-side.ready { opacity: 0.85; transition: opacity 0.7s ease; }
.fruit-side.pulse { animation: fruitShakeFast 0.15s ease-in-out infinite alternate; }
.leaf { position: absolute; pointer-events: none; opacity: 0; animation: floatLeaf linear infinite; z-index: 0; }
.login-brand { text-align: center; z-index: 1; animation: slideUp 0.5s var(--ease) both; }
.login-logo { width: 78px; height: 78px; margin: 0 auto 12px; border-radius: 22px; background: rgba(255, 255, 255, 0.12); border: 2px solid rgba(255, 255, 255, 0.25); display: grid; place-items: center; font-size: 40px; backdrop-filter: blur(4px); }
.login-brand .b1 { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -0.5px; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3); }
.login-brand .b2 { font-size: 12.5px; color: rgba(255, 255, 255, 0.65); letter-spacing: 2.5px; margin-top: 4px; font-weight: 600; }
.login-card { z-index: 1; width: 100%; max-width: 372px; background: rgba(255, 255, 255, 0.97); border-radius: 20px; padding: 20px 18px 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; gap: 10px; animation: modalIn 0.45s 0.08s var(--ease) both; }
.login-card h2 { font-size: 16px; font-weight: 700; color: var(--df-green); display: flex; align-items: center; gap: 6px; }
.login-card .field { margin: 0; }
.pin-dots { display: flex; justify-content: center; gap: 16px; padding: 8px 0 4px; }
.pin-dots i { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--green-m); background: transparent; transition: background 0.12s, border-color 0.12s; }
.pin-dots i.on { background: var(--df-green-btn); border-color: var(--df-green-btn); animation: pulse 0.25s ease; }
.pin-dots.shake { animation: shake 0.42s ease; }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pin-key { min-height: 46px; border: 1.5px solid #c8ddc8; border-radius: 12px; background: #f4f8f5; font-size: 21px; font-weight: 700; transition: transform 0.08s, background 0.1s; }
.pin-key:active { transform: scale(0.93); background: var(--green-l); }
.pin-key.fn { color: var(--muted); font-size: 17px; }
.login-gear { position: absolute; right: 12px; bottom: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 1.5px solid rgba(255, 255, 255, 0.3); color: rgba(255, 255, 255, 0.8); font-size: 17px; display: grid; place-items: center; z-index: 2; }
.login-credit { z-index: 1; margin: 2px 0 0; color: rgba(255, 255, 255, 0.6); font-size: 13px; }

/* ---------- หน้าหลักของสาขา (การ์ดเมนูแบบ POS) ---------- */
.stagger > * { animation: cardIn 0.4s var(--ease) both; }
.stagger > *:nth-child(1) { animation-delay: 0.02s; }
.stagger > *:nth-child(2) { animation-delay: 0.07s; }
.stagger > *:nth-child(3) { animation-delay: 0.12s; }
.stagger > *:nth-child(4) { animation-delay: 0.17s; }
.stagger > *:nth-child(5) { animation-delay: 0.22s; }
.stagger > *:nth-child(6) { animation-delay: 0.27s; }
.stagger > *:nth-child(7) { animation-delay: 0.32s; }
.act { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; min-height: 66px; box-shadow: var(--sh); transition: transform 0.14s var(--ease), box-shadow 0.14s; }
.act:active:not(:disabled) { transform: scale(0.985); }
.act:disabled { opacity: 0.5; cursor: not-allowed; }
.act .ic { flex: none; width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 23px; background: var(--green-l); }
.act .tx { flex: 1; min-width: 0; }
.act .tx b { display: block; font-size: 17px; line-height: 1.2; }
.act .tx small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.act .chev { flex: none; opacity: 0.4; font-size: 22px; }
.act.primary { background: linear-gradient(135deg, var(--df-green-btn), var(--df-green)); color: #fff; border-color: transparent; box-shadow: 0 4px 14px rgba(29, 74, 46, 0.35); }
.act.primary .ic { background: rgba(255, 255, 255, 0.18); }
.act.primary .tx small { color: rgba(255, 255, 255, 0.82); }
.act.danger .ic { background: var(--red-l); }
.act.danger .tx b { color: var(--red); }
.mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 12px; }
.mini { background: #fff; border: 1px solid var(--border); border-radius: var(--r); padding: 8px 10px; text-align: center; box-shadow: var(--sh); }
.mini b { display: block; font-size: 24px; font-weight: 800; line-height: 1.1; }
.mini span { font-size: 12.5px; color: var(--muted); }
.mini.ok b { color: var(--green); }
.mini.warn b { color: var(--yellow); }
.mini.err b { color: var(--red); }

/* ---------- หน้านับ: แถบบน + รายการเลื่อนในกรอบตัวเอง ---------- */
.subbar { flex: none; padding: 10px 12px 8px; background: #fff; border-bottom: 1px solid var(--border); }
.prog { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.prog-bar { flex: 1; height: 10px; border-radius: 99px; background: var(--border2); overflow: hidden; }
.prog-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green-btn), var(--green)); border-radius: 99px; transition: width 0.35s var(--ease); }
.prog-text { font-weight: 800; white-space: nowrap; }
.chips { display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 12px; border-radius: 99px; border: 2px solid var(--border); background: #fff; font-weight: 700; font-size: 14px; color: var(--muted); transition: background 0.15s, border-color 0.15s, color 0.15s; }
.chip.on { border-color: var(--green); background: var(--green-l); color: var(--green-dk); }

.list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); }

.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; width: 100%; min-height: 62px; padding: 9px 14px; text-align: left; background: #fff; border: 0; border-bottom: 1px solid var(--border2); transition: background 0.15s; }
.row:active { background: var(--green-l); }
.row.ok { background: #f2faf5; }
.row.diff { background: var(--yellow-l); }
.row.off { background: var(--blue-l); }
.row.flash { animation: rowFlash 0.9s ease-out; }
.row-name { font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-sub { font-size: 13px; color: var(--muted); margin-top: 1px; }
.row-sub b { color: var(--text); font-weight: 700; margin-right: 8px; }
.row-sub .tag { color: var(--blue); font-weight: 700; margin-left: 8px; }
.row-sys, .row-cnt { text-align: right; min-width: 52px; }
.row-sys span, .row-cnt .lbl { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin: 0; }
.row-sys b { font-size: 17px; color: var(--muted); }
.row-cnt { min-width: 64px; }
.row-cnt b { font-size: 24px; font-weight: 800; color: var(--green-dk); line-height: 1.1; }
.row-cnt .dash { font-size: 22px; color: var(--dim); }
.badge { display: inline-block; margin-top: 1px; padding: 0 7px; border-radius: 99px; font-size: 13px; font-weight: 800; font-style: normal; }
.badge.plus { background: var(--blue-l); color: var(--blue); }
.badge.minus { background: var(--red-l); color: var(--red); }
.badge.same { background: var(--green-l); color: var(--green); }
.row-cnt .diffline { display: block; }

/* ---------- สรุป ---------- */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px; }
.stat { background: #fff; border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--sh); }
.stat b { display: block; font-size: 28px; font-weight: 800; line-height: 1.1; }
.stat span { font-size: 14px; color: var(--muted); }
.stat.ok b { color: var(--green); }
.stat.warn b { color: var(--yellow); }
.stat.err b { color: var(--red); }
.stats.anim .stat b { animation: countUp 0.55s var(--ease) both; }
.stats.anim .stat:nth-child(2) b { animation-delay: 0.06s; }
.stats.anim .stat:nth-child(3) b { animation-delay: 0.12s; }
.stats.anim .stat:nth-child(4) b { animation-delay: 0.18s; }
.sumline { margin: 0 2px 10px; color: var(--muted); font-size: 14px; }
.toolrow { display: flex; gap: 8px; margin: 0 0 10px; }
.toolrow .btn { min-height: 44px; flex: 1; font-size: 15px; }
.tabs { display: flex; gap: 6px; margin: 4px 0 0; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }

      '<div class="rk-dates"><label>ตั้งแต่วันที่<input type="date" id="rk-from" value="' + (o.from || def[2]) + '"></label><label>ถึงวันที่<input type="date" id="rk-to" value="' + (o.to || def[3]) + '"></label></div>' +
      '<button type="button" class="rk-btn pri" id="rk-go" style="width:100%">🔎 ดึงข้อมูล</button><div class="rk-res" id="rk-res"></div>' +
      '<button type="button" class="rk-btn rk-close" id="rk-x">ปิด</button></div>'
    document.body.appendChild(ov)
    const $ = (s) => ov.querySelector(s)
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey, true) }
    const onKey = (e) => { if (e.key === 'Escape' && !document.getElementById('pk-ov') && !document.getElementById('pv')) close() }
    document.addEventListener('keydown', onKey, true)
    ov.addEventListener('click', (e) => { if (e.target === ov) close() })
    $('#rk-x').onclick = close
    ov.querySelectorAll('[data-rk-p]').forEach((b) => { b.onclick = () => { const p = presets.find((x) => x[0] === b.dataset.rkP); $('#rk-from').value = p[2]; $('#rk-to').value = p[3]; ov.querySelectorAll('[data-rk-p]').forEach((x) => x.classList.toggle('on', x === b)); run() } })
    let busy = false, data = null
    async function run() {
      const from = $('#rk-from').value, to = $('#rk-to').value, res = $('#rk-res')
      if (!from || !to) { res.innerHTML = '<div class="rk-err">เลือกวันที่ให้ครบ</div>'; return }
      if (from > to) { res.innerHTML = '<div class="rk-err">วันที่เริ่มต้องไม่หลังวันที่สิ้นสุด</div>'; return }
      if (busy) return
      busy = true; $('#rk-go').disabled = true; $('#rk-go').textContent = 'กำลังดึงข้อมูล…'; res.innerHTML = ''
      try { data = await o.run(from, to) } catch (e) { data = null; res.innerHTML = '<div class="rk-err">ดึงข้อมูลไม่สำเร็จ: ' + esc(e && e.message ? e.message : e) + '</div>' }
      busy = false; $('#rk-go').disabled = false; $('#rk-go').textContent = '🔎 ดึงข้อมูล'
      if (!data) return
      const label = dTH(from) + ' – ' + dTH(to)
      if (!data.rows.length) { res.innerHTML = '<div class="rk-info">ไม่มีข้อมูลช่วง ' + esc(label) + '</div>'; return }
      res.innerHTML = '<div class="rk-info"><b>ช่วง ' + esc(label) + '</b><br>' + (data.summary || (data.rows.length + ' แถว')) + '</div>' + (data.extra || '') +
        '<div class="rk-row">' + (data.print ? '<button type="button" class="rk-btn pri" data-rk="print">🖨️ พิมพ์</button>' : '') + '<button type="button" class="rk-btn" data-rk="xlsx">📗 Excel</button><button type="button" class="rk-btn" data-rk="csv">📄 CSV</button></div>'
      const file = (data.file || o.title) + '_' + from + '_ถึง_' + to
      res.querySelectorAll('[data-rk]').forEach((b) => {
        b.onclick = () => {
          try {
            if (b.dataset.rk === 'print') data.print(from, to)
            else if (b.dataset.rk === 'xlsx') xlsx(file, data.heads, data.rows, data.widths, data.sheet || o.title)
            else csv(file, data.heads, data.rows)
          } catch (e) { alertBox(e) }
        }
      })
      if (data.bind) data.bind(res, from, to)
    }
    const alertBox = (e) => { const r = $('#rk-res'); const d = document.createElement('div'); d.className = 'rk-err'; d.textContent = 'ทำไม่สำเร็จ: ' + (e && e.message ? e.message : e); r.prepend(d) }
    $('#rk-go').onclick = run
    if (o.autoRun !== false) run()
    return { close: close }
  }
  // ค้นหาแบบใกล้เคียง: ตรงบางส่วน > ตัวอักษรเรียงตามลำดับ (ไม่ต้องพิมพ์ครบ)
  const norm = (s) => String(s || '').toLowerCase().replace(/[\s\-_.,()\/:'"+]+/g, '')
  function fuzzy(q, text) {
    const t = norm(text), toks = String(q || '').toLowerCase().split(/\s+/).map(norm).filter(Boolean)
    if (!toks.length) return -1
    let total = 0
    for (const k of toks) {
      const i = t.indexOf(k)
      if (i >= 0) { total += 1000 - Math.min(i, 500); continue }
      if (k.length < 3) return -1
      let last = -1, gaps = 0
      for (const ch of k) { const j = t.indexOf(ch, last + 1); if (j < 0) return -1; if (last >= 0) gaps += j - last - 1; last = j }
      if (gaps > k.length * 3) return -1
      total += 400 - gaps * 10
    }
    return total / toks.length
  }
  return { saveBlob: saveBlob, csv: csv, xlsx: xlsx, rangeModal: rangeModal, fuzzy: fuzzy, dTH: dTH, dk: dk }
})()
</script>

function(){return it.SCAN_TYPE_CHANGE_ANCHOR_ID},t.prototype.getScanRegionId=function(){return"".concat(this.elementId,"__scan_region")},t.prototype.getDashboardId=function(){return"".concat(this.elementId,"__dashboard")},t.prototype.getHeaderMessageContainerId=function(){return"".concat(this.elementId,"__header_message")},t.prototype.getCameraPermissionButtonId=function(){return it.CAMERA_PERMISSION_BUTTON_ID},t.prototype.getCameraScanRegion=function(){return document.getElementById(this.getDashboardSectionCameraScanRegionId())},t.prototype.getDashboardSectionSwapLink=function(){return document.getElementById(this.getDashboardSectionSwapLinkId())},t.prototype.getHeaderMessageDiv=function(){return document.getElementById(this.getHeaderMessageContainerId())},t}()})(),__Html5QrcodeLibrary__=n})();if (window) { if (!Html5QrcodeScanner) { var Html5QrcodeScanner = window.__Html5QrcodeLibrary__.Html5QrcodeScanner; } if (!Html5Qrcode) { var Html5Qrcode = window.__Html5QrcodeLibrary__.Html5Qrcode; } if (!Html5QrcodeSupportedFormats) { var Html5QrcodeSupportedFormats = window.__Html5QrcodeLibrary__.Html5QrcodeSupportedFormats } if (!Html5QrcodeScannerState) { var Html5QrcodeScannerState = window.__Html5QrcodeLibrary__.Html5QrcodeScannerState; } if (!Html5QrcodeScanType) { var Html5QrcodeScanType = window.__Html5QrcodeLibrary__.Html5QrcodeScanType; }}

<script>
(function () {
  'use strict'
  const CFG = window.APP_CONFIG
  const M = CFG.MODE // 'receive' | 'return'
  const $ = (s, r) => (r || document).querySelector(s)
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const pad2 = (n) => String(n).padStart(2, '0')
  const todayKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) }
  const timeKey = (d) => pad2(d.getHours()) + ':' + pad2(d.getMinutes())
  const fmtNum = (n) => (Math.round(Number(n) * 1000) / 1000).toLocaleString('en-US')
  const branchById = (id) => CFG.BRANCHES.find((b) => b.id === id)

  /* ---------- localStorage (ห่อ try/catch) ---------- */
  const K = { settings: 'rc_settings_' + M, session: 'rc_session_' + M, entries: 'rc_entries_' + M, extra: 'rc_products_extra', sync: 'rc_sync_' + M, srv: 'rc_products_srv', pend: 'rc_products_push' }
  function lsGet(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def } catch (e) { return def } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { /* ไม่เป็นไร */ } }
  const getSettings = () => Object.assign({ user: '', lastBranch: '' }, lsGet(K.settings, {}))
  const saveSettings = (p) => lsSet(K.settings, Object.assign(getSettings(), p))

  /* ---------- State ---------- */
  let SESSION = null
  let view = 'login' // login | main | setup | products
  let entries = lsGet(K.entries, [])
  // ฐานสินค้า = ไฟล์ที่ฝังไว้ (PRODUCT_DB) + สินค้าที่เพิ่ม/แก้ในเครื่องนี้ (extra)
  const BASE = window.PRODUCT_DB || {}
  let extra = lsGet(K.extra, null)
  if (!extra || typeof extra !== 'object') {
    extra = {}
    const oldPend = lsGet('rc_prod_pending', {}) || {} // สินค้าที่เคยเพิ่มหน้างานจากเวอร์ชันเก่า
    Object.keys(oldPend).forEach((c) => { if (!BASE[c] && Array.isArray(oldPend[c])) extra[c] = oldPend[c] })
    lsSet(K.extra, extra)
  }
  // ฐานสินค้าจากชีต (แท็บ ฐานสินค้า) — ถ้ายังโหลดไม่ได้ ใช้ไฟล์ที่ฝังไว้แทน
  let SRV = lsGet(K.srv, null) || { ver: '', map: null }
  let PEND = lsGet(K.pend, {}) || {} // สินค้าที่เพิ่ม/แก้ในเครื่องนี้ รอส่งขึ้นชีต
  function addProd(code, name, pack) { extra[code] = [name, pack]; PEND[code] = [name, pack]; lsSet(K.pend, PEND) }
  let products = {}
  let codeList = []
  function rebuildProducts() {
    products = Object.assign({}, SRV.map && Object.keys(SRV.map).length ? SRV.map : BASE, extra)
    codeList = Object.keys(products).sort().map((c) => ({ c: c, d: c.replace(/\D/g, ''), z: c.replace(/\D/g, '').replace(/^0+/, '') }))
  }
  rebuildProducts()
  const prodCount = () => codeList.length
  const saveProducts = () => { lsSet(K.extra, extra); rebuildProducts(); if (typeof scheduleSync === 'function' && Object.keys(PEND).length) scheduleSync(500) }
  let sending = false
  const lg = { branchId: '' }
  const RET = CFG.MODE === 'return' // ตีคืน: เก็บเป็นรอบ จนกด "ส่งคืนคลัง"
  const defSel = () => (RET ? 'pending' : todayKey())
  let selDate = defSel()

  function pruneEntries() {
    if (CFG.EXPIRY) return // ทะเบียนวันหมดอายุ: เก็บจนกว่าจะลบเอง
    const cut = todayKey(new Date(Date.now() - 14 * 86400000))
    if (RET) { entries = entries.filter((e) => !e.sent || e.sent >= cut); return } // ตีคืน: รอส่งคืน = เก็บไว้จนกดส่ง, ส่งแล้วเก็บดูย้อนหลัง 14 วัน
    entries = entries.filter((e) => e.date >= cut) // เก็บย้อนหลัง 14 วันในเครื่อง
  }
  const saveEntries = () => lsSet(K.entries, entries)

  /* =====================================================================
     ซิงก์มือถือ ↔ คอม (Apps Script action "syncEntries")
     - บันทึก/แก้/ลบ → ส่งขึ้นชีตอัตโนมัติภายใน ~1 วินาที
     - เปิด/รีเฟรชหน้าเว็บ หรือทุก 20 วินาที → ดึงรายการของทุกเครื่องในสาขาเดียวกันมาแสดง
     - แต่ละรายการมี ID ของตัวเอง ค่าที่แก้ทีหลังสุดชนะ ไม่มีการปนกันระหว่างแอป/สาขา
     ===================================================================== */
  const SYNC_URL = String(CFG.SYNC_URL || '').trim()
  let SYS = lsGet(K.sync, null)
  if (!SYS || typeof SYS !== 'object' || SYS.v !== 1) {
    SYS = { v: 1, dirty: {}, tomb: {}, off: 0 }
    entries.forEach((e) => { SYS.dirty[e.id] = 1 }) // รายการเดิมในเครื่อง ส่งขึ้นชีตด้วย
  }
  const SY = { state: 'idle', at: 0, msg: '', timer: null, inflight: null, again: false }
  const nowT = () => Date.now() + (SYS.off || 0)
  const saveSys = () => lsSet(K.sync, SYS)
  function scheduleSync(ms) { clearTimeout(SY.timer); SY.timer = setTimeout(() => { syncEntries() }, ms == null ? 800 : ms) }
  function touchEntry(e) { e.u = nowT(); SYS.dirty[e.id] = 1; delete SYS.tomb[e.id]; saveSys(); scheduleSync() }
  function removeEntries(ids) {
    const set = new Set(ids)
    entries.forEach((e) => { if (set.has(e.id)) { SYS.tomb[e.id] = { t: nowT(), date: e.date, b: e.branchId }; SYS.dirty[e.id] = 1 } })
    entries = entries.filter((e) => !set.has(e.id))
    saveEntries(); saveSys(); scheduleSync(300)
  }
  const syncCut = () => (CFG.EXPIRY ? '0000-00-00' : todayKey(new Date(Date.now() - (RET ? 90 : 14) * 86400000)))
  const canSync = () => !!(SYNC_URL && SESSION)
  function syncPayload() {
    const items = []
    Object.keys(SYS.dirty).forEach((id) => {
      const e = entries.find((x) => x.id === id)
      if (e) { if (e.branchId === SESSION.branchId) items.push({ id: e.id, u: e.u || 0, date: e.date, time: e.time, ts: e.ts, user: e.user, code: e.code, name: e.name, pack: e.pack, qty: e.qty, note: e.note || '', branchId: e.branchId, exp: e.exp || '', sent: e.sent || '' }) }
      else if (SYS.tomb[id] && (!SYS.tomb[id].b || SYS.tomb[id].b === SESSION.branchId)) items.push({ id: id, del: 1, t: SYS.tomb[id].t, date: SYS.tomb[id].date })
      else if (!SYS.tomb[id]) delete SYS.dirty[id]
    })
    return items
  }
  async function syncEntries() {
    if (!canSync()) return
    if (SY.inflight) { SY.again = true; return SY.inflight }
    SY.inflight = doSync()
    try { await SY.inflight } finally { SY.inflight = null }
    if (SY.again) { SY.again = false; scheduleSync(200) }
  }
  async function doSync() {
    const bid = SESSION.branchId
    const sent = syncPayload()
    const prodSent = Object.keys(PEND).map((c) => ({ code: c, name: PEND[c][0], pack: PEND[c][1] }))
    SY.state = 'busy'
    updateSyncUi()
    const t0 = Date.now()
    let d
    try {
      const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null
      const tm = setTimeout(() => { if (ctrl) ctrl.abort() }, 30000)
      const res = await fetch(SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'syncEntries', app: M, branch: branchById(bid).name, branchId: bid, from: syncCut(), items: sent, user: SESSION.user, prodVer: SRV.ver || '', products: prodSent }), signal: ctrl ? ctrl.signal : undefined })
      clearTimeout(tm)
      const txt = await res.text()
      let j
      try { j = JSON.parse(txt) } catch (e) { throw new Error(/<html/i.test(txt) ? 'Apps Script ตอบกลับเป็นหน้าเว็บ — ตรวจการ Deploy (Who has access: Anyone)' : 'ข้อมูลตอบกลับผิดรูปแบบ') }
      if (!j.ok) throw new Error(j.message || j.error || 'ซิงก์ไม่สำเร็จ')
      d = j.data || {}
    } catch (e) {
      SY.state = 'err'
      SY.msg = e && e.name === 'AbortError' ? 'หมดเวลารอ' : navigator.onLine === false ? 'ไม่มีอินเทอร์เน็ต' : (e && e.message) || 'เชื่อมต่อไม่ได้'
      updateSyncUi()
      return
    }
    // ฐานสินค้า: ส่งสำเร็จแล้วเอาออกจากคิว / รับรายการล่าสุดจากชีต
    prodSent.forEach((p) => { if (PEND[p.code] && PEND[p.code][0] === p.name && PEND[p.code][1] === p.pack) { delete PEND[p.code]; delete extra[p.code] } })
    lsSet(K.pend, PEND); lsSet(K.extra, extra)
    if (d.products && typeof d.products === 'object') { SRV = { ver: String(d.prodVer || ''), map: d.products }; lsSet(K.srv, SRV) }
    if (prodSent.length || d.products) rebuildProducts()
    if (!SESSION || SESSION.branchId !== bid) return
    if (d.serverTime) { const off = Math.round(Number(d.serverTime) - (t0 + Date.now()) / 2); if (isFinite(off)) SYS.off = off }
    // ส่งสำเร็จ และไม่ได้แก้ซ้ำระหว่างรอ → ไม่ต้องส่งอีก
    sent.forEach((s) => {
      const e = entries.find((x) => x.id === s.id)
      if (s.del ? !e && SYS.tomb[s.id] && SYS.tomb[s.id].t === s.t : e && (e.u || 0) === s.u) delete SYS.dirty[s.id]
    })
    let got = 0
    const srv = new Map()
    ;(d.items || []).forEach((s) => srv.set(String(s.id), s))
    const dels = new Map()
    ;(d.dels || []).forEach((x) => dels.set(String(x.id), Number(x.t) || 0))
    const br = branchById(bid).name
    // ลบตามเครื่องอื่น / ตามที่ลบแถวในชีต
    entries = entries.filter((e) => {
      if (e.branchId !== bid || SYS.dirty[e.id]) return true
      if (dels.has(e.id) && dels.get(e.id) >= (e.u || 0)) { got++; return false }
      if (e.date >= syncCut() && !srv.has(e.id)) { got++; return false }
      return true
    })
    dels.forEach((t, id) => { if (!SYS.tomb[id]) SYS.tomb[id] = { t: t, b: bid, date: '' } })
    srv.forEach((s, id) => {
      if (SYS.dirty[id]) return
      const su = Number(s.u) || 0
      const tb = SYS.tomb[id]
      if (tb && tb.t >= su) return
      const e = entries.find((x) => x.id === id)
      const rec = { id: id, ts: Number(s.ts) || 0, date: s.date, time: s.time, branchId: bid, branch: br, user: s.user, code: s.code, name: s.name, pack: s.pack, qty: Number(s.qty) || 0, note: s.note || '', u: su, exp: s.exp || '', sent: s.sent || '' }
      if (!e) { entries.push(rec); got++ }
      else if (su > (e.u || 0)) { Object.assign(e, rec); got++ }
    })
    // ล้าง tomb เก่า (เกิน 45 วัน)
    const tcut = nowT() - 45 * 86400000
    Object.keys(SYS.tomb).forEach((id) => { if (SYS.tomb[id].t < tcut && !SYS.dirty[id]) delete SYS.tomb[id] })
    saveEntries()
    saveSys()
    SY.state = 'ok'
    SY.at = Date.now()
    SY.msg = ''
    if ((got && view === 'main' || d.products && view === 'products') && !document.querySelector('.modal-ov, .modal-sheet, #pk-ov')) render()
    else updateSyncUi()
  }
  function syncLineHtml() {
    if (!SESSION) return ''
    if (!SYNC_URL) return '⚠️ ยังไม่ได้ใส่ SYNC_URL — ข้อมูลอยู่ในเครื่องนี้เท่านั้น'
    const n = Object.keys(SYS.dirty).length
    const hm = (t) => { const x = new Date(t); return pad2(x.getHours()) + ':' + pad2(x.getMinutes()) + ':' + pad2(x.getSeconds()) }
    if (SY.state === 'err') return '⚠️ ซิงก์ไม่ได้: ' + esc(SY.msg) + (n ? ' (ค้างส่ง ' + n + ' รายการ เก็บไว้ในเครื่องแล้ว)' : '') + ' <button type="button" data-act="sync-now">ลองใหม่</button>'
    if (SY.state === 'busy') return '🔄 กำลังซิงก์…'
    if (SY.state === 'ok') return '🔗 ซิงก์กับทุกเครื่องของสาขานี้แล้ว · ' + hm(SY.at) + (n ? ' · รอส่ง ' + n : '') + ' <button type="button" data-act="sync-now">ซิงก์ตอนนี้</button>'
    return '🔗 ซิงก์อัตโนมัติ' + (n ? ' · รอส่ง ' + n : '')
  }
  function updateSyncUi() {
    const html = syncLineHtml()
    document.querySelectorAll('.sync-line').forEach((el) => {
      el.innerHTML = html
      el.classList.toggle('err', !!html && (SY.state === 'err' || !SYNC_URL))
    })
  }
  function flushBeacon() {
    try {
      if (!canSync() || (!Object.keys(SYS.dirty).length && !Object.keys(PEND).length) || !navigator.sendBeacon) return
      const body = JSON.stringify({ action: 'syncEntries', app: M, branch: branchById(SESSION.branchId).name, branchId: SESSION.branchId, from: syncCut(), items: syncPayload(), user: SESSION.user, prodVer: SRV.ver || '', products: Object.keys(PEND).map((c) => ({ code: c, name: PEND[c][0], pack: PEND[c][1] })) })
      navigator.sendBeacon(SYNC_URL, new Blob([body], { type: 'text/plain;charset=utf-8' }))
    } catch (e) { /* รอบหน้าส่งซ้ำ */ }
  }
  function getSession() {
    const s = lsGet(K.session, null)
    if (!s || s.date !== todayKey() || !branchById(s.branchId) || !String(s.user || '').trim()) return null
    return s
  }
  // รายการที่แสดง: ของสาขานี้ ตามวันที่เลือก (ค่าเริ่มต้น = วันนี้)
  const myEntries = (d) => CFG.EXPIRY
    ? entries.filter((e) => SESSION && e.branchId === SESSION.branchId).sort((a, b) => String(a.exp || '9999').localeCompare(String(b.exp || '9999')) || b.ts - a.ts)
    : RET ? entries.filter((e) => SESSION && e.branchId === SESSION.branchId && ((d || selDate) === 'pending' ? !e.sent : e.sent === (d || selDate))).sort((a, b) => b.ts - a.ts)
    : entries.filter((e) => SESSION && e.branchId === SESSION.branchId && e.date === (d || selDate)).sort((a, b) => b.ts - a.ts)
  const myDates = () => RET ? ['pending'].concat(Array.from(new Set(entries.filter((e) => SESSION && e.branchId === SESSION.branchId && e.sent).map((e) => e.sent))).sort().reverse()) : Array.from(new Set(entries.filter((e) => SESSION && e.branchId === SESSION.branchId).map((e) => e.date).concat([todayKey()]))).sort().reverse()

  /* ---------- Toast ---------- */
  let tt = null
  function toast(msg, type, ms) {
    const el = $('#toast')
    el.textContent = msg
    el.className = 'toast show ' + (type === 'err' ? 'err' : '')
    clearTimeout(tt)
    tt = setTimeout(() => { el.className = 'toast' }, ms || 2200)
  }

  /* ---------- Modal ---------- */
  let modalEl = null
  let lastModalClose = 0
  function openModal(html) {
    closeModal()
    const ov = document.createElement('div')
    ov.className = 'modal-ov'
    ov.innerHTML = '<div class="modal-sheet" role="dialog" aria-modal="true">' + html + '</div>'
    ov.addEventListener('click', (e) => { if (e.target === ov) closeModal() })
    document.body.appendChild(ov)
    modalEl = ov
    return ov.firstElementChild
  }
  function closeModal() {
    if (!modalEl) return
    modalEl.remove()
    modalEl = null
    lastModalClose = Date.now()
  }
  function confirmBox(title, text, okLabel, onOk) {
    const sh = openModal('<div class="m-title">' + esc(title) + '</div><p>' + esc(text) + '</p><div class="m-actions"><button type="button" class="btn btn-ghost" data-x="no">ยกเลิก</button><button type="button" class="btn btn-primary" data-x="ok">' + esc(okLabel) + '</button></div>')
    $('[data-x=no]', sh).onclick = closeModal
    $('[data-x=ok]', sh).onclick = () => { closeModal(); onOk() }
  }

  /* ---------- ฟอร์มกรอกรายการ (ใช้ทั้งเพิ่มใหม่และแก้ไข) ---------- */
  function parseCode(text) {
    const s = String(text == null ? '' : text).trim()
    if (!s) return ''
    return s.split('|')[0].trim().toUpperCase().replace(/\s+/g, '')
  }
  /* ---------- ของไม่ได้คุณภาพ (รับเข้า) / วันหมดอายุ (ทะเบียน) ---------- */
  const QC_PREFIX = '⚠️ ไม่ได้คุณภาพ: '
  const MOVED_TAG = ' [ส่งตีคืนแล้ว]'
  const isQc = (e) => String(e.note || '').indexOf(QC_PREFIX) === 0
  const isMoved = (e) => String(e.note || '').indexOf(MOVED_TAG) >= 0
  function splitQc(note) { // → { qc, rest, moved }
    let n = String(note || '')
    const moved = n.indexOf(MOVED_TAG) >= 0
    n = n.replace(MOVED_TAG, '')
    if (n.indexOf(QC_PREFIX) !== 0) return { qc: '', rest: n, moved: moved }
    n = n.slice(QC_PREFIX.length)
    const i = n.indexOf(' — ')
    return { qc: i >= 0 ? n.slice(0, i) : n, rest: i >= 0 ? n.slice(i + 3) : '', moved: moved }
  }
  const joinQc = (qc, rest, moved) => (qc ? QC_PREFIX + qc + (rest ? ' — ' + rest : '') : rest) + (moved ? MOVED_TAG : '')
  // ส่งรายการที่ไม่ได้คุณภาพไปแอปตีคืน (เขียนลงแท็บ ซิงค์ตีคืน_สาขา ผ่านชีตกลาง)
  async function moveToReturn(e) {
    if (!SYNC_URL) { toast('ยังไม่ได้ตั้งค่า SYNC_URL', 'err'); return }
    const sp = splitQc(e.note)
    const now = new Date()
    const item = { id: 'mv-' + e.id, u: nowT(), date: todayKey(now), time: timeKey(now), ts: now.getTime(), user: SESSION.user, code: e.code, name: e.name, pack: e.pack, qty: e.qty,
      note: 'คุณภาพไม่ได้มาตรฐาน — จากรับเข้า: ' + (sp.qc || '-') + (sp.rest ? ' (' + sp.rest + ')' : ''), branchId: e.branchId }
    try {
      const res = await fetch(SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'syncEntries', app: CFG.MOVE_TO, branch: branchById(e.branchId).name, branchId: e.branchId, from: todayKey(), items: [item] }) })
      const j = JSON.parse(await res.text())
      if (!j.ok) throw new Error(j.message || 'ส่งไม่สำเร็จ')
    } catch (err) {
      toast('ส่งไปตีคืนไม่สำเร็จ: ' + (navigator.onLine === false ? 'ไม่มีอินเทอร์เน็ต' : err.message), 'err', 4000)
      return
    }
    e.note = joinQc(sp.qc, sp.rest, true)
    touchEntry(e)
    saveEntries()
    toast('↩️ ส่ง ' + (e.name || e.code) + ' × ' + fmtNum(e.qty) + ' ไปแอปตีคืนแล้ว', 'ok', 3500)
    render()
  }
  const dayMs = 86400000
  const daysLeft = (exp) => (exp ? Math.round((Date.parse(exp + 'T00:00:00') - Date.parse(todayKey() + 'T00:00:00')) / dayMs) : null)
  const WARN = Number(CFG.EXP_WARN_DAYS) || 60 // แจ้งเตือนก่อนหมดอายุกี่วัน (ต้องตีคืนคลัง)
  function expState(exp) {
    const d = daysLeft(exp)
    if (d == null || isNaN(d)) return { cls: '', label: 'ไม่ระบุ', d: null }
    if (d < 0) return { cls: 'x-bad', label: 'หมดอายุแล้ว ' + -d + ' วัน', d: d }
    if (d === 0) return { cls: 'x-bad', label: 'หมดอายุวันนี้', d: d }
    if (d <= 7) return { cls: 'x-hot', label: 'เหลือ ' + d + ' วัน', d: d }
    if (d <= WARN) return { cls: 'x-warn', label: 'เหลือ ' + d + ' วัน', d: d }
    return { cls: 'x-ok', label: 'เหลือ ' + d + ' วัน', d: d }
  }
  const fmtExp = (k) => { const p = String(k || '').split('-'); return p.length === 3 ? Number(p[2]) + '/' + Number(p[1]) + '/' + p[0] : '-' }
  function openEntryModal(code, existing) {
    const prev = existing || null
    const sameToday = !prev && entries.filter((e) => e.branchId === SESSION.branchId && e.code === code && e.date === todayKey())
    const sumToday = sameToday ? sameToday.reduce((a, e) => a + e.qty, 0) : 0
    const reasons = CFG.REASONS
    const pd = products[code]
    const curNote = prev ? prev.note : ''
    const inList = reasons && reasons.indexOf(curNote) >= 0
    const sh = openModal(
      '<div class="m-title">' + esc(prev ? 'แก้ไขรายการ' : CFG.TITLE) + '</div>' +
      '<div class="m-code">รหัส: <b>' + esc(code) + '</b>' + (sumToday ? ' · วันนี้บันทึกไปแล้ว ' + fmtNum(sumToday) : '') + '</div>' +
      (pd || prev ? '' : '<div class="warn">⚠️ ไม่พบรหัสนี้ในฐานสินค้า — กรอกชื่อ/Packsize แล้วระบบจะเพิ่มเข้าฐานสินค้าให้</div>') +
      '<label class="field"><span>ชื่อสินค้า</span><input id="f-name" type="text" autocomplete="off" value="' + esc(prev ? prev.name : (pd ? pd[0] : '')) + '" placeholder="(ไม่บังคับ)"></label>' +
      '<label class="field"><span>Packsize</span><input id="f-pack" type="text" autocomplete="off" value="' + esc(prev ? prev.pack : (pd ? pd[1] : '')) + '" placeholder="(ไม่บังคับ)"></label>' +
      '<label class="field"><span>' + esc(CFG.QTY_LABEL) + '</span><input id="f-qty" type="number" inputmode="decimal" min="0" step="any" value="' + (prev ? prev.qty : '') + '" placeholder="0"></label>' +
      (reasons
        ? '<label class="field"><span>เหตุผลตีคืน</span><select id="f-reason"><option value="">— เลือกเหตุผล —</option>' +
          reasons.map((r) => '<option' + (curNote === r ? ' selected' : '') + '>' + esc(r) + '</option>').join('') + '</select></label>' +
          '<label class="field"><span>หมายเหตุเพิ่มเติม</span><input id="f-note" type="text" autocomplete="off" value="' + esc(inList ? '' : curNote) + '" placeholder="(ไม่บังคับ)"></label>'
        : (CFG.EXPIRY ? '<label class="field"><span>วันหมดอายุ</span><input id="f-exp" type="date" value="' + esc(prev && prev.exp ? prev.exp : '') + '"></label>' : '') +
          (CFG.QC_REASONS ? '<label class="field"><span>สภาพสินค้า</span><select id="f-qc"><option value="">✅ ปกติ</option>' + CFG.QC_REASONS.map((r) => '<option' + (splitQc(curNote).qc === r ? ' selected' : '') + '>⚠️ ' + esc(r) + '</option>').join('') + '</select></label>' : '') +
          '<label class="field"><span>' + esc(CFG.NOTE_LABEL) + '</span><input id="f-note" type="text" autocomplete="off" value="' + esc(CFG.QC_REASONS ? splitQc(curNote).rest : curNote) + '" placeholder="(ไม่บังคับ)"></label>') +
      '<div class="err" id="f-err"></div>' +
      '<div class="m-actions"><button type="button" class="btn btn-ghost" data-x="no">ยกเลิก</button><button type="button" class="btn btn-primary" data-x="ok">' + (prev ? 'บันทึกการแก้ไข' : '✔ บันทึก') + '</button></div>'
    )
    const qty = $('#f-qty', sh)
    setTimeout(() => { try { qty.focus() } catch (e) { /* ไม่เป็นไร */ } }, 60)
    const submit = () => {
      const q = Number(qty.value)
      const err = $('#f-err', sh)
      if (!qty.value || !isFinite(q) || q <= 0) { err.textContent = 'กรุณาใส่จำนวนที่มากกว่า 0'; return }
      let note = $('#f-note', sh).value.trim()
      if (reasons) {
        const r = $('#f-reason', sh).value
        if (!r) { err.textContent = 'กรุณาเลือกเหตุผลตีคืน'; return }
        note = r + (note ? ' — ' + note : '')
      }
      if (CFG.QC_REASONS) note = joinQc($('#f-qc', sh).value.replace(/^⚠️ /, ''), note, prev ? isMoved(prev) : false)
      let exp = ''
      if (CFG.EXPIRY) { exp = $('#f-exp', sh).value; if (!exp) { err.textContent = 'กรุณาใส่วันหมดอายุ'; return } }
      const name = $('#f-name', sh).value.trim()
      const pack = $('#f-pack', sh).value.trim()
      if (!products[code] && name) { addProd(code, name, pack); saveProducts() }
      if (prev) {
        prev.name = name; prev.pack = pack; prev.qty = q; prev.note = note
        if (CFG.EXPIRY) prev.exp = exp
        touchEntry(prev)
        toast('แก้ไขแล้ว')
      } else {
        const now = new Date()
        const ne = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: now.getTime(), date: todayKey(now), time: timeKey(now), branchId: SESSION.branchId, branch: branchById(SESSION.branchId).name, user: SESSION.user, code: code, name: name, pack: pack, qty: q, note: note }
        if (CFG.EXPIRY) ne.exp = exp
        entries.push(ne)
        touchEntry(ne)
        selDate = defSel()
        toast('บันทึกแล้ว: ' + (name || code) + ' × ' + fmtNum(q))
        try { if (navigator.vibrate) navigator.vibrate(40) } catch (e) { /* ไม่เป็นไร */ }
        pushRecent(name || code, q)
      }
      saveEntries()
      closeModal()
      render()
    }
    $('[data-x=no]', sh).onclick = closeModal
    $('[data-x=ok]', sh).onclick = submit
    sh.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); submit() } })
  }
  /* ---------- กรอกจำนวนแบบเร็ว (แป้นตัวเลข) — ใช้ตอนสแกน/กรอกรหัสเพื่อเพิ่มรายการใหม่ ---------- */
  function openQuickQty(code, backToCode) {
    const reasons = CFG.REASONS
    const pd = products[code]
    const name = pd ? pd[0] : ''
    const pack = pd ? pd[1] : ''
    const prevList = entries.filter((e) => e.branchId === SESSION.branchId && e.code === code && e.date === todayKey())
    const sumToday = prevList.reduce((a, e) => a + e.qty, 0)
    const repeat = !CFG.EXPIRY && prevList.length > 0 // สแกน/กรอกรหัสนี้ซ้ำในวันเดียวกัน → ถามว่าแทนที่ / บวกเพิ่ม / ล้าง
    let expVal = ''
    let mode = 'add'
    let val = ''
    const sh = openModal('<div class="qk"></div>')
    sh.tabIndex = -1
    const root = $('.qk', sh)
    const head = (title, sub) =>
      '<div class="m-title">' + esc(title) + '</div>' +
      '<div class="qk-prod"><b>' + esc(name || code) + '</b><small>' + esc(sub) + '</small></div>'
    const info = 'รหัส ' + code + (pack ? ' · ' + pack : '') + (sumToday ? ' · วันนี้บันทึกไปแล้ว ' + fmtNum(sumToday) : '')
    const save = (note) => {
      const q = Number(val)
      if (repeat && mode === 'replace') removeEntries(prevList.map((e) => e.id))
      const now = new Date()
      const ne = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: now.getTime(), date: todayKey(now), time: timeKey(now), branchId: SESSION.branchId, branch: branchById(SESSION.branchId).name, user: SESSION.user, code: code, name: name, pack: pack, qty: q, note: note || '' }
      if (CFG.EXPIRY) {
        ne.exp = expVal
        const same = entries.find((e) => e.branchId === SESSION.branchId && e.code === code && e.exp === expVal)
        if (same || !(q > 0)) {
          if (same && q > 0) { same.qty = q; same.user = SESSION.user; same.time = timeKey(now); touchEntry(same); saveEntries() }
          else if (same) removeEntries([same.id])
          toast(same ? (q > 0 ? '🔁 แทนที่ล็อตหมด ' + fmtExp(expVal) + ' เป็น ' + fmtNum(q) : '🗑 ลบล็อตหมด ' + fmtExp(expVal) + ' แล้ว') : 'จำนวนเป็น 0 — ไม่ได้บันทึก')
          closeModal(); render(); return
        }
      }
      entries.push(ne)
      touchEntry(ne)
      saveEntries()
      selDate = defSel()
      toast(CFG.EXPIRY ? 'บันทึกแล้ว: ' + (name || code) + ' × ' + fmtNum(q) + ' · หมดอายุ ' + fmtExp(expVal)
        : String(note || '').indexOf(QC_PREFIX) === 0 ? '⚠️ บันทึกของไม่ได้คุณภาพแล้ว — กด ↩️ ในรายการเพื่อส่งไปตีคืน'
        : !repeat ? 'บันทึกแล้ว: ' + (name || code) + ' × ' + fmtNum(q)
        : mode === 'replace' ? '🔁 แทนที่แล้ว: ' + (name || code) + ' = ' + fmtNum(q)
        : '➕ บวกเพิ่มแล้ว: ' + (name || code) + ' รวม ' + fmtNum(Math.round((sumToday + q) * 1000) / 1000))
      try { if (navigator.vibrate) navigator.vibrate(40) } catch (e) { /* ไม่เป็นไร */ }
      pushRecent(name || code, q)
      closeModal()
      render()
      setTimeout(() => trWarn(code), 1300)
      if (backToCode && !scanOv) setTimeout(openCodeModal, 80) // กรอกรหัสเองจากหน้าหลัก → เปิดช่องรหัสต่อให้เลย (ถ้าสแกนอยู่ กล้องพร้อมสแกนต่อเอง)
    }
    const drawReasons = () => {
      root.innerHTML = head('เหตุผลตีคืน', (repeat ? (mode === 'replace' ? '🔁 แทนที่เป็น ' : '➕ บวกเพิ่ม ') : 'จำนวน ') + fmtNum(Number(val)) + ' · ' + info) +
        '<div class="qk-reasons">' + reasons.map((r, i) => '<button type="button" class="qk-reason" data-r="' + i + '">' + esc(r) + '</button>').join('') + '</div>' +
        '<label class="field"><span>หมายเหตุเพิ่มเติม (ไม่บังคับ)</span><input id="qk-note" type="text" autocomplete="off" placeholder="พิมพ์แล้วค่อยแตะเหตุผล"></label>' +
        '<div class="m-actions"><button type="button" class="btn btn-ghost" data-x="back">‹ แก้จำนวน</button></div>'
      $('[data-x=back]', root).onclick = drawQty
      root.querySelectorAll('.qk-reason').forEach((b) => {
        b.onclick = () => { const n = $('#qk-note', root).value.trim(); const r = reasons[Number(b.dataset.r)]; save(r + (n ? ' — ' + n : '')) }
      })
    }
    const press = (k) => {
      const err = $('#f-err', root); if (err) err.textContent = ''
      if (k === 'del') val = val.slice(0, -1)
      else if (k === '.') { if (val.indexOf('.') < 0) val = (val || '0') + '.' }
      else if (val.length < 7) val = val === '0' ? k : val + k
      const d = $('#qk-disp', root); d.textContent = val || '0'; d.className = 'qk-disp' + (val ? '' : ' dim')
      previewChoices()
    }
    const r3 = (x) => Math.round(x * 1000) / 1000
    function previewChoices() {
      if (!repeat) return
      const q = Number(val) || 0
      const a = $('#qk-pv-add', root), r = $('#qk-pv-rep', root)
      if (a) a.textContent = 'ยอดวันนี้ ' + fmtNum(sumToday) + ' → ' + fmtNum(r3(sumToday + q))
      if (r) r.textContent = 'ยอดวันนี้ ' + fmtNum(sumToday) + ' → ' + fmtNum(q)
    }
    const ok = (m) => {
      if (m) mode = m
      const q = Number(val)
      if (!val || !isFinite(q) || q <= 0) { $('#f-err', root).textContent = 'กรุณาใส่จำนวนที่มากกว่า 0'; return }
      if (CFG.EXPIRY) drawExp(); else if (reasons) drawReasons(); else save('')
    }
    // รับเข้า: ของไม่ได้คุณภาพ → เลือกเหตุผล (บันทึกเป็นรายการแยก มีปุ่มส่งไปตีคืน)
    const okQc = () => {
      const q = Number(val)
      if (!val || !isFinite(q) || q <= 0) { $('#f-err', root).textContent = 'กรุณาใส่จำนวนที่มากกว่า 0'; return }
      mode = 'add'
      root.innerHTML = head('⚠️ ของไม่ได้คุณภาพ', 'จำนวน ' + fmtNum(q) + ' · ' + info) +
        '<div class="qk-reasons">' + CFG.QC_REASONS.map((r, i) => '<button type="button" class="qk-reason qc" data-r="' + i + '">' + esc(r) + '</button>').join('') + '</div>' +
        '<label class="field"><span>รายละเอียดเพิ่มเติม (ไม่บังคับ)</span><input id="qk-note" type="text" autocomplete="off" placeholder="พิมพ์แล้วค่อยแตะเหตุผล"></label>' +
        '<div class="m-actions"><button type="button" class="btn btn-ghost" data-x="back">‹ แก้จำนวน</button></div>'
      $('[data-x=back]', root).onclick = drawQty
      root.querySelectorAll('.qk-reason').forEach((b) => {
        b.onclick = () => { const n = $('#qk-note', root).value.trim(); save(joinQc(CFG.QC_REASONS[Number(b.dataset.r)], n, false)) }
      })
    }
    // ทะเบียนวันหมดอายุ: ใส่วันหมดอายุหลังใส่จำนวน
    function drawExp() {
      const q = Number(val)
      const add = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return todayKey(d) }
      const lots = lotsOfCode(code)
      root.innerHTML = head('📅 วันหมดอายุ', 'จำนวน ' + fmtNum(q) + ' · ' + info) +
        (lots.length ? '<div class="qk-lots">ในทะเบียนแล้ว: ' + lots.map((e) => '<b>' + fmtNum(e.qty) + '</b> หมด ' + esc(fmtExp(e.exp))).join(' · ') + '<br>เลือกวันเดิม = แทนที่จำนวนล็อตนั้น · วันใหม่ = เพิ่มล็อตใหม่</div>' +
          '<div class="pre-chips">' + lots.map((e) => '<button type="button" class="pre-chip" data-exp="' + esc(e.exp) + '">ล็อต ' + esc(fmtExp(e.exp)) + '</button>').join('') + '</div>' : '') +
        '<label class="field"><span>วันหมดอายุ (ดูจากฉลากสินค้า)</span><input id="qk-exp" type="date" value="' + esc(expVal) + '" style="font-size:20px;min-height:52px"></label>' +
        '<div class="pre-chips">' + [30, 60, 90, 180, 365].map((n) => '<button type="button" class="pre-chip" data-add="' + n + '">+' + n + ' วัน</button>').join('') + '</div>' +
        '<div class="err" id="f-err"></div>' +
        '<div class="m-actions"><button type="button" class="btn btn-ghost" data-x="back">‹ แก้จำนวน</button><button type="button" class="btn btn-primary" data-x="save">✔ บันทึก</button></div>'
      const inp = $('#qk-exp', root)
      root.querySelectorAll('[data-add]').forEach((b) => { b.onclick = () => { inp.value = add(Number(b.dataset.add)) } })
      root.querySelectorAll('[data-exp]').forEach((b) => { b.onclick = () => { inp.value = b.dataset.exp } })
      $('[data-x=back]', root).onclick = () => { expVal = inp.value; drawQty() }
      $('[data-x=save]', root).onclick = () => {
        if (!inp.value) { $('#f-err', root).textContent = 'กรุณาใส่วันหมดอายุ'; return }
        expVal = inp.value

  // ค้นรหัสจากตัวเลขบางส่วน: พิมพ์ 01004 / 1004 ก็เจอ FG01004 ไม่ต้องพิมพ์ FG/PK
  function matchCodes(q) {
    q = String(q || '').toUpperCase().replace(/\s+/g, '')

    if (!q) return res
    const digits = /^\d+$/.test(q)
    const qz = q.replace(/^0+/, '')
    const b0 = [], b1 = [], b2 = []
    for (const it of codeList) {
      if (it.c === q || (digits && (it.d === q || (qz && it.z === qz)))) b0.push(it.c)
      else if (it.c.indexOf(q) === 0 || (digits && (it.d.indexOf(q) === 0 || (qz && q === qz && it.z.indexOf(qz) === 0)))) b1.push(it.c)
      else if (it.c.indexOf(q) > 0 || (digits && it.d.indexOf(q) >= 0)) b2.push(it.c)
    }
    res.exact = b0
    res.list = b0.concat(b1, b2)
    return res
  }

  async function startScanner() {
    const my = ++scanToken
    if (typeof Html5Qrcode === 'undefined') { setScanMsg('โหลดตัวสแกนไม่สำเร็จ — ใช้ปุ่ม "🔢 รหัส" หรือ "🔤 ชื่อ" ได้เลย', true); return }

  /* ---------- ส่งออก Excel ---------- */
  const CRC_TABLE = (function () {
    const t = new Uint32Array(256)
    for (let n = 0; n < 256; n++) {
      let c = n
      for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1
      t[n] = c >>> 0
    }
    return t
  })()
  function crc32(bytes) {
    let c = 0xffffffff
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8)
    return (c ^ 0xffffffff) >>> 0
  }
  function zipStore(files) {
    const enc = new TextEncoder()
    const now = new Date()
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)
    const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()
    const parts = []
    const central = []
    let offset = 0
    files.forEach((f) => {
      const nameB = enc.encode(f.name)
      const data = enc.encode(f.data)
      const crc = crc32(data)
      const lh = new DataView(new ArrayBuffer(30))
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true)
      lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true)
      lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, nameB.length, true); lh.setUint16(28, 0, true)
      parts.push(new Uint8Array(lh.buffer), nameB, data)
      const ch = new DataView(new ArrayBuffer(46))
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true)
      ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true)
      ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, nameB.length, true)
      ch.setUint32(42, offset, true)
      central.push(new Uint8Array(ch.buffer), nameB)
      offset += 30 + nameB.length + data.length
    })
    let cdSize = 0
    central.forEach((c) => { cdSize += c.length })
    const end = new DataView(new ArrayBuffer(22))

  function onLoginKey(e) {
    if (view !== 'login' || e.ctrlKey || e.metaKey || e.altKey || modalEl) return

    else if (e.key === 'Backspace' && !typing) { pinPress('B'); e.preventDefault() }

  /* ---------- ฐานสินค้า (รหัส / ชื่อ / Packsize) ---------- */
  let draft = null // { rows:[[code,name,pack]], skipped }
  function parseDelimited(text) {
    text = String(text).replace(/^﻿/, '')
    const first = text.split(/\r?\n/).find((l) => l.trim()) || ''
    const cnt = (ch) => first.split(ch).length - 1
    const d = cnt('\t') >= 1 ? '\t' : cnt(',') >= cnt(';') ? ',' : ';'
    const rows = []
    let row = [], cell = '', q = false
    for (let i = 0; i < text.length; i++) {
      const c = text[i]
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++ } else q = false } else cell += c
      } else if (c === '"') q = true
      else if (c === d) { row.push(cell); cell = '' }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = '' }
      else cell += c
    }
    if (cell !== '' || row.length) { row.push(cell); rows.push(row) }
    return rows
  }
  function rowsToProducts(rows) {
    rows = rows.map((r) => r.map((c) => String(c == null ? '' : c).trim())).filter((r) => r.some((c) => c))
    if (!rows.length) return { rows: [], skipped: 0 }
    let ic = 0, inm = 1, ip = 2, start = 0
    const h = rows[0]
    const fc = h.findIndex((c) => /รหัส|code|sku|barcode|บาร์โค้ด/i.test(c))
    const fn = h.findIndex((c, i) => i !== fc && /ชื่อ|name|desc|รายการ|สินค้า/i.test(c))
    if (fc >= 0 && fn >= 0) {
      ic = fc; inm = fn
      ip = h.findIndex((c, i) => i !== fc && i !== fn && /pack|แพ็ค|แพค|ขนาด|size|หน่วย/i.test(c))
      start = 1
    }
    const map = new Map()
    let skipped = 0
    for (let i = start; i < rows.length; i++) {
      const code = parseCode(rows[i][ic])
      if (!code) { skipped++; continue }
      map.set(code, [code, rows[i][inm] || '', ip >= 0 ? rows[i][ip] || '' : ''])
    }
    return { rows: Array.from(map.values()), skipped: skipped }
  }
  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw')
    const w = ds.writable.getWriter()
    w.write(bytes); w.close()
    return new Uint8Array(await new Response(ds.readable).arrayBuffer())
  }
  async function readXlsx(buf) {
    if (typeof DecompressionStream === 'undefined') throw new Error('เบราว์เซอร์นี้อ่านไฟล์ Excel ตรง ๆ ไม่ได้ — ให้ Save As เป็น CSV หรือคัดลอกแล้ววางแทน')
    const u8 = new Uint8Array(buf), dv = new DataView(buf)
    let e = u8.length - 22
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--
    if (e < 0) throw new Error('ไฟล์ไม่ใช่ .xlsx ที่ถูกต้อง')
    const n = dv.getUint16(e + 10, true)
    let p = dv.getUint32(e + 16, true)
    const files = {}
    const dec = new TextDecoder('utf-8')
    for (let i = 0; i < n; i++) {
      const method = dv.getUint16(p + 10, true), csz = dv.getUint32(p + 20, true)
      const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), lo = dv.getUint32(p + 42, true)
      const name = dec.decode(u8.subarray(p + 46, p + 46 + nl))
      files[name] = { method: method, csz: csz, lo: lo }
      p += 46 + nl + el + cl
    }
    const get = async (name) => {
      const f = files[name]
      if (!f) return null
      const ds = f.lo + 30 + dv.getUint16(f.lo + 26, true) + dv.getUint16(f.lo + 28, true)
      const raw = u8.subarray(ds, ds + f.csz)
      return dec.decode(f.method === 0 ? raw : await inflateRaw(raw))
    }
    const xml = (t) => new DOMParser().parseFromString(t, 'application/xml')
    const sharedXml = await get('xl/sharedStrings.xml')
    const shared = sharedXml ? Array.from(xml(sharedXml).getElementsByTagName('si')).map((si) => Array.from(si.getElementsByTagName('t')).map((t) => t.textContent).join('')) : []
    let sheetPath = null
    const wb = await get('xl/workbook.xml'), rels = await get('xl/_rels/workbook.xml.rels')
    if (wb && rels) {
      const sh = xml(wb).getElementsByTagName('sheet')[0]
      const rid = sh && (sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id'))
      const rel = Array.from(xml(rels).getElementsByTagName('Relationship')).find((r) => r.getAttribute('Id') === rid)
      if (rel) { const t = rel.getAttribute('Target'); sheetPath = t.charAt(0) === '/' ? t.slice(1) : 'xl/' + t }
    }
    if (!sheetPath || !files[sheetPath]) sheetPath = Object.keys(files).filter((k) => /^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort()[0]
    const sx = sheetPath && (await get(sheetPath))
    if (!sx) throw new Error('ไม่พบข้อมูลในไฟล์ Excel')
    const rows = []
    Array.from(xml(sx).getElementsByTagName('row')).forEach((r) => {
      const arr = []
      Array.from(r.getElementsByTagName('c')).forEach((c) => {
        const ref = c.getAttribute('r') || ''
        const letters = ref.replace(/[0-9]/g, '')
        let ci = 0
        for (let k = 0; k < letters.length; k++) ci = ci * 26 + (letters.charCodeAt(k) - 64)
        ci -= 1
        const t = c.getAttribute('t')
        let v = ''
        if (t === 'inlineStr') v = Array.from(c.getElementsByTagName('t')).map((x) => x.textContent).join('')
        else {
          const ve = c.getElementsByTagName('v')[0]
          const raw = ve ? ve.textContent : ''
          v = t === 's' ? shared[Number(raw)] || '' : raw
        }
        if (ci >= 0) arr[ci] = v
      })
      rows.push(Array.from(arr, (x) => (x == null ? '' : x)))
    })
    return rows
  }
  async function readFile(file) {
    const buf = await file.arrayBuffer()
    if (/\.xlsx$/i.test(file.name) || new Uint8Array(buf.slice(0, 2)).join() === '80,75') return readXlsx(buf)
    if (/\.xls$/i.test(file.name)) throw new Error('ไฟล์ .xls เก่าอ่านไม่ได้ — เปิดใน Excel แล้ว Save As เป็น .xlsx หรือ CSV')
    let text
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf) } catch (e) { text = new TextDecoder('windows-874').decode(buf) }
    return parseDelimited(text)
  }

  /* =====================================================================
     ข้อมูลเคลื่อนไหวสินค้าจาก SAP (Transfer / GR / DO / GI / อื่น ๆ)
     - วาง/อัปโหลดไฟล์ SAP ทุกเช้า → รวม Batch ต่อรหัสต่อเอกสาร → เก็บในชีต (แท็บ SAPเคลื่อนไหว_สาขา)
     - Transfer เทียบกับรับเข้าในแอป · GI เทียบกับรอบ "ส่งคืนคลัง" ในแอปตีคืน (เป็นรอบ ๆ แบบ FIFO)
     ===================================================================== */
  const SAPM_ON = CFG.MODE === 'receive' || CFG.MODE === 'return'
  const SAPM_TYPES = [['Transfer', '🚚 Transfer — โอนย้ายจากคลังใหญ่เข้าหน้าร้าน', 'in'], ['GR', '📥 GR — รับเข้าคลัง', 'in'], ['DO', '🛒 DO — ขายออก', 'out'], ['GI', '↩️ GI — ตัดสต๊อก ตีคืนของเสียกลับคลัง', 'out'], ['CN', '🧾 CN — ยกเลิกบิล ของกลับเข้าสต๊อก', 'in'], ['OTHER', '📄 อื่น ๆ', 'in']]
  const sapmType = (t) => (['Transfer', 'GR', 'DO', 'GI', 'CN'].indexOf(t) >= 0 ? t : 'OTHER')
  const TOL_TR = 0.05 // Transfer: ต่างไม่เกินกี่แพ็คถือว่าตรง
  const TOL_GI = 0.4 // GI ตัดเป็นเศษแพ็คได้
  const GI_WAIT = Number(CFG.GI_WAIT_DAYS) || 14 // คลังอาจทำ GI ช้า — รอได้กี่วันก่อนเตือนแดง
  const SAPM_KEY = 'br_sapm_cache'
  let SAPM = { rows: [], at: 0, branchId: '' }
  let sapDraft = null
  const r2 = (x) => Math.round(x * 100) / 100
  const addDays = (k, n) => { const d = new Date(k + 'T00:00:00'); d.setDate(d.getDate() + n); return todayKey(d) }
  const dShort = (k) => { const p = String(k).split('-'); return p.length === 3 ? Number(p[2]) + '/' + Number(p[1]) + '/' + p[0] : k }
  function sapmLoadCache() {
    if (!SESSION) return
    const c = (lsGet(SAPM_KEY, {}) || {})[SESSION.branchId]
    SAPM = c && Array.isArray(c.rows) ? { rows: c.rows, at: c.at || 0, branchId: SESSION.branchId } : { rows: [], at: 0, branchId: SESSION.branchId }
  }
  function sapmSaveCache() {
    const all = lsGet(SAPM_KEY, {}) || {}
    all[SAPM.branchId] = { rows: SAPM.rows, at: SAPM.at }
    try { lsSet(SAPM_KEY, all) } catch (e) { /* เต็ม — ไม่เป็นไร ดึงจากชีตใหม่ได้ */ }
  }
  async function sapApi(action, body) {
    if (!SYNC_URL) throw new Error('ยังไม่ได้ตั้งค่า SYNC_URL')
    const res = await fetch(SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: action, branch: SESSION_BRANCH().name }, body || {})) })
    const txt = await res.text()
    let j
    try { j = JSON.parse(txt) } catch (e) { throw new Error(/<html/i.test(txt) ? 'Apps Script ตอบกลับเป็นหน้าเว็บ — ตรวจการ Deploy' : 'ข้อมูลตอบกลับผิดรูปแบบ') }
    if (!j.ok) throw new Error(j.message || j.error || 'ไม่สำเร็จ')
    return j.data || {}
  }
  let sapmBusy = false
  async function sapmFetch(quiet) {
    if (!SAPM_ON || !SESSION || !SYNC_URL || sapmBusy) return
    sapmBusy = true
    try {
      const d = await sapApi('getSapMoves', { from: todayKey(new Date(Date.now() - 90 * 86400000)) })
      SAPM = { rows: d.rows || [], at: Date.now(), branchId: SESSION.branchId }
      sapmSaveCache()
      if ((view === 'main' || view === 'sap') && !document.querySelector('.modal-ov, .modal-sheet, #pk-ov')) render()
    } catch (e) { if (!quiet) toast('โหลดข้อมูล SAP ไม่สำเร็จ: ' + e.message, 'err', 4000) }
    finally { sapmBusy = false }
  }
  // ---------- แปลงหน่วย SAP → แพ็คไซต์ในฐานสินค้า ----------
  function kgPer(p) { const m = /(\d+(?:\.\d+)?)\s*(kg|g)\b/i.exec(p || ''); if (!m) return null; const v = parseFloat(m[1]); return /kg/i.test(m[2]) ? v : v / 1000 }
  function pcPer(p) { const m = /(\d+)\s*pc/i.exec(p || ''); return m ? Number(m[1]) : null }
  function toPacks(code, uom, q) {
    const pd = products[code]
    if (!pd) return { p: null, why: 'ไม่มีในฐานสินค้า' }
    const pk = String(pd[1] || '').trim(), u = String(uom || '').trim().toLowerCase(), p = pk.toLowerCase()
    if (u === p) return { p: q }
    if (u === 'kg' || u === 'kgs' || u === 'กก.' || u === 'กิโลกรัม') { const k = kgPer(pk); return k ? { p: q / k } : { p: null, why: 'ฐานสินค้าไม่มีน้ำหนักต่อแพ็ค (' + pk + ')' } }
    if (u === 'g' || u === 'กรัม') { const k = kgPer(pk); return k ? { p: q / 1000 / k } : { p: null, why: 'ฐานสินค้าไม่มีน้ำหนักต่อแพ็ค (' + pk + ')' } }
    if (['pce', 'pcs', 'pc', 'ea', 'ชิ้น'].indexOf(u) >= 0) { const n = pcPer(pk); return { p: n ? q / n : q } }
    if (/^pack/.test(u) && /^pack/.test(p)) return { p: q }
    return { p: null, why: 'หน่วย SAP (' + uom + ') ไม่ตรงกับฐาน (' + pk + ')' }
  }
  const qtyOf = (x) => (x.qin || 0) || (x.qout || 0)
  function packsOf(x) { return toPacks(x.code, x.uom, qtyOf(x)) }
  // ---------- อ่านไฟล์ / ข้อความที่วางจาก SAP ----------
  function sapmParse(rows) {
    rows = rows.map((r) => r.map((c) => String(c == null ? '' : c).replace(/ /g, ' ').trim()))
    const H = rows.findIndex((r) => r.some((c) => /ประเภทเอกสาร/.test(c)) && r.some((c) => /รหัสสินค้า/.test(c)))
    let ix = { code: 0, name: 1, date: 3, type: 4, doc: 5, wh: 7, qin: 8, qout: 9, uom: 10 }
    if (H >= 0) {
      const h = rows[H], f = (re, def) => { const i = h.findIndex((x) => re.test(x)); return i >= 0 ? i : def }
      ix = { code: f(/^รหัสสินค้า/, 0), name: f(/^ชื่อสินค้า/, 1), date: f(/วันที่เอกสาร/, 3), type: f(/ประเภทเอกสาร/, 4), doc: f(/เลขที่เอกสาร/, 5), wh: f(/ชื่อคลัง/, 7), qin: f(/จำนวนรับเข้า/, 8), qout: f(/จำนวนตัดออก/, 9), uom: f(/uom|หน่วย/i, 10) }
    }
    const body = (H >= 0 ? rows.slice(H + 1) : rows).filter((r) => /^[A-Z]{1,4}\d{3,}/i.test(r[ix.code] || ''))
    // วันที่แบบ ว/ด/ป หรือ ด/ว/ป → ดูจากข้อมูลทั้งชุด
    let dmy = true
    body.forEach((r) => { const m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]\d{2,4}/.exec(r[ix.date] || ''); if (m && Number(m[2]) > 12) dmy = false })
    const pd2 = (n) => (n < 10 ? '0' : '') + Number(n)
    const fix = (y, m, d) => { y = Number(y); if (y < 100) y += 2000; if (y > 2400) y -= 543; return m >= 1 && m <= 12 && d >= 1 && d <= 31 ? y + '-' + pd2(m) + '-' + pd2(d) : '' }
    const pdate = (s) => {
      if (/^\d{4,5}(\.\d+)?$/.test(s)) { const n = Math.floor(Number(s)); if (n > 20000 && n < 80000) return new Date(Date.UTC(1899, 11, 30) + n * 86400000).toISOString().slice(0, 10) }
      let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s)
      if (m) return fix(m[1], +m[2], +m[3])
      m = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/.exec(s)
      if (m) return dmy ? fix(m[3], +m[2], +m[1]) : fix(m[3], +m[1], +m[2])
      return ''
    }
    const num = (v) => Number(String(v || '').replace(/,/g, '')) || 0
    const agg = new Map(), whs = new Set()
    let bad = 0
    body.forEach((r) => {
      const code = r[ix.code].toUpperCase(), date = pdate(r[ix.date]), type = sapmType(r[ix.type]) === 'OTHER' ? (r[ix.type] || 'อื่น ๆ') : r[ix.type]
      if (!date) { bad++; return }
      if (r[ix.wh]) whs.add(r[ix.wh])
      const doc = String(r[ix.doc] || '').replace(/\.0+$/, '')
      const k = type + '|' + date + '|' + doc + '|' + code
      const x = agg.get(k) || { type: type, date: date, doc: doc, code: code, name: r[ix.name].replace(/\s+/g, ' '), qin: 0, qout: 0, uom: r[ix.uom], lines: 0 }
      x.qin = Math.round((x.qin + num(r[ix.qin])) * 1000) / 1000
      x.qout = Math.round((x.qout + num(r[ix.qout])) * 1000) / 1000
      x.lines++
      agg.set(k, x)
    })
    const list = Array.from(agg.values())
    const dates = list.map((x) => x.date).sort()
    return { rows: list, lines: body.length, bad: bad, whs: Array.from(whs), from: dates[0] || '', to: dates[dates.length - 1] || '' }
  }
  // ---------- Transfer ↔ รับเข้า ----------
  function trDocsFor(day) {
    const tr = SAPM.rows.filter((x) => x.type === 'Transfer')
    let use = tr.filter((x) => x.date === day)
    if (!use.length) use = tr.filter((x) => x.date === addDays(day, -1)) // โอนตอนเที่ยงคืน ลงวันที่ก่อนหน้า
    return use
  }
  function trRecon(day) {
    const use = trDocsFor(day)
    if (!use.length) return null
    const m = new Map()
    use.forEach((x) => {
      const c = m.get(x.code) || { code: x.code, name: x.name, uom: x.uom, qty: 0, packs: 0, why: '', docs: new Set() }
      const pk = packsOf(x)
      c.qty = Math.round((c.qty + qtyOf(x)) * 1000) / 1000
      if (pk.p == null) { c.packs = null; c.why = pk.why } else if (c.packs != null) c.packs += pk.p
      c.docs.add(x.doc); m.set(x.code, c)
    })
    const recv = new Map()
    entries.filter((e) => SESSION && e.branchId === SESSION.branchId && e.date === day && CFG.MODE === 'receive').forEach((e) => recv.set(e.code, Math.round(((recv.get(e.code) || 0) + e.qty) * 1000) / 1000))
    const gr = new Set(SAPM.rows.filter((x) => x.type === 'GR' && (x.date === day || x.date === addDays(day, -1))).map((x) => x.code))
    recv.forEach((q, c) => { if (!m.has(c)) m.set(c, { code: c, name: (products[c] || [''])[0], uom: '', qty: null, packs: null, why: '', docs: new Set(), only: true }) })
    const rows = Array.from(m.values()).sort((a, b) => (a.code < b.code ? -1 : 1)).map((x) => {
      const r = recv.get(x.code) || 0
      let st, txt
      if (x.only) { st = gr.has(x.code) ? 'info' : 'warn'; txt = gr.has(x.code) ? 'ℹ️ มีใน GR (รับเข้าคลัง)' : '＋ รับแต่ไม่มีในใบโอน' }
      else if (!r) { st = 'bad'; txt = '✖ ยังไม่ได้บันทึกรับ' }
      else if (x.packs == null) { st = 'warn'; txt = '? แปลงหน่วยไม่ได้ — ' + x.why }
      else { const d = r2(r - x.packs); st = Math.abs(d) <= TOL_TR ? 'ok' : 'bad'; txt = st === 'ok' ? '✔ ตรง' : d < 0 ? '▼ ขาด ' + fmtNum(-d) : '▲ เกิน ' + fmtNum(d) }
      return Object.assign(x, { recv: r, st: st, txt: txt, packs: x.packs == null ? null : r2(x.packs) })
    })
    const docs = Array.from(new Set(use.map((x) => x.doc)))
    return { day: day, docDate: use[0].date, docs: docs, rows: rows, nRecv: recv.size, bad: rows.filter((r) => r.st === 'bad' || r.st === 'warn').length }
  }
  /* ---------- ทะเบียนปัญหา: เปิดเคสจากใบโอนที่รับไม่ตรง / GI ไม่ตรงกับตีคืน ---------- */
  function trIssues() {
    const since = addDays(todayKey(), -14), out = []
    const days = Array.from(new Set(SAPM.rows.filter((x) => x.type === 'Transfer' && x.date >= since).map((x) => x.date))).sort()
    const seen = new Set()
    days.forEach((d) => {
      const R = trRecon(d)
      if (!R || !R.nRecv) return // ยังไม่ได้เริ่มรับของรอบนั้น
      R.rows.forEach((x) => {
        if (!(x.st === 'bad' || (x.st === 'warn' && x.only))) return
        const k = R.docDate + '|' + x.code; if (seen.has(k)) return; seen.add(k)
        const type = x.only ? 'ไม่มีใบโอน / รับนอกใบโอน' : x.recv < (x.packs || 0) ? 'โอนขาด' : 'โอนเกิน'
        out.push({ type: type, doc: Array.from(x.docs || []).join(', '), docDate: R.docDate, code: x.code, name: x.name || (products[x.code] || [''])[0], expect: x.packs == null ? '' : x.packs, actual: x.recv, dept: x.recv ? 'คลังสินค้า' : 'ยังไม่ทราบ', detail: 'ตรวจรับ ' + dShort(d) + ': ' + x.txt })
      })
    })
    return out
  }
  async function giIssues() {
    const G = giRecon(await loadRets()), out = []
    G.rounds.forEach((R) => R.items.forEach((i) => {
      if (i.st !== 'bad') return
      out.push({ type: i.got ? 'GI ไม่ตรงกับตีคืน' : 'ยังไม่ทำ GI เกินกำหนด', doc: i.docs.join(', '), docDate: R.sent, code: i.code, name: (products[i.code] || [''])[0], expect: i.need, actual: i.got, dept: 'คลังสินค้า', detail: 'ส่งคืนคลัง ' + dShort(R.sent) + ': ' + i.txt })
    }))
    G.extra.forEach((x) => out.push({ type: 'GI ไม่ตรงกับตีคืน', doc: x.doc, docDate: x.date, code: x.code, name: x.name || (products[x.code] || [''])[0], expect: 0, actual: x.left, dept: 'ยังไม่ทราบ', detail: 'มี GI ใน SAP แต่ไม่มีการตีคืนในแอป' }))
    return out
  }
  async function openIssues() {
    if (!SYNC_URL) { toast('ยังไม่ได้ตั้งค่า SYNC_URL', 'err'); return }

    const src = []
    if (CFG.MODE === 'receive') src.push({ label: 'ใบโอนที่รับไม่ตรง (14 วันล่าสุด)', hint: 'โอนขาด / โอนเกิน / รับนอกใบโอน — จากใบตรวจรับของโอนย้าย', get: async () => trIssues() })
    src.push({ label: 'GI ไม่ตรงกับการตีคืน', hint: 'ส่งคืนคลังแล้วแต่ไม่มี GI / GI ไม่ครบ เกิน ' + GI_WAIT + ' วัน · GI ที่ไม่มีในแอป', get: giIssues })
    window.IssueKit.init({ call: (a, b) => sapApi(a, Object.assign({ user: SESSION ? SESSION.user : '' }, b || {})), user: () => (SESSION ? SESSION.user : ''), branch: () => SESSION_BRANCH().name, toast: toast, sources: src })
    window.IssueKit.open()
  }
  function printTransfer(day0) {

    const today = todayKey()
